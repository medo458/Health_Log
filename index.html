<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Life Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0d0d0f;--bg2:#141416;--bg3:#1a1a1e;--bg4:#202024;
  --border:#2a2a2e;--border2:#333338;
  --text:#f0ede8;--text2:#9a9793;--text3:#5a5755;
  --accent:#e8c547;--accent2:#c4a030;
  --green:#3dd68c;--red:#e85454;--orange:#f0923a;--blue:#5b9ef0;--purple:#a78bfa;
  --card-r:12px;
  --nav-h:64px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .4s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{font-family:var(--font-display);font-size:44px;font-weight:900;color:var(--accent);letter-spacing:.15em}
.loading-logo span{color:var(--text3);font-weight:400}
.loading-msg{font-family:var(--font-display);font-size:13px;color:var(--text3);letter-spacing:.12em}
.loading-bar{width:180px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.loading-fill{height:100%;background:var(--accent);border-radius:2px;animation:loadpulse 1.2s ease-in-out infinite}
@keyframes loadpulse{0%{width:0%}50%{width:80%}100%{width:100%}}

/* LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh}
.page{display:none;flex:1;padding:0 0 calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));overflow-y:auto}
.page.active{display:block}
.inner{max-width:860px;margin:0 auto;padding:16px}

/* TOP BAR */
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--accent);letter-spacing:.12em}
.topbar-logo span{color:var(--text3);font-weight:400;font-size:16px}
.topbar-right{display:flex;align-items:center;gap:8px}
.save-status{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;color:var(--text3);display:flex;align-items:center;gap:4px}
.save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:background .3s}
.save-status.saved .dot{background:var(--green)}
.save-status.saving .dot{background:var(--accent)}
.save-status.error .dot{background:var(--red)}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;padding-bottom:env(safe-area-inset-bottom);z-index:200}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;transition:all .15s;border:none;background:transparent}
.nav-icon{font-size:22px;line-height:1;transition:transform .15s}
.nav-label{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);transition:color .15s}
.nav-item.active .nav-label{color:var(--accent)}
.nav-item.active .nav-icon{transform:scale(1.1)}
.nav-badge{position:absolute;top:2px;right:calc(50% - 18px);background:var(--red);color:white;font-size:9px;font-weight:700;border-radius:99px;padding:1px 5px;font-family:var(--font-display)}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:16px;margin-bottom:12px}
.card-title{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:12px;border-left:2px solid var(--accent);padding-left:8px}

/* ===================== DASHBOARD ===================== */
.dash-greeting{font-family:var(--font-display);font-size:28px;font-weight:900;color:var(--text);letter-spacing:.04em;margin-bottom:4px}
.dash-date{font-size:12px;color:var(--text3);margin-bottom:16px;font-family:var(--font-display);letter-spacing:.08em}

/* Phase widget */
.dash-phase{border-radius:var(--card-r);padding:14px 16px;margin-bottom:12px;border:1px solid;cursor:pointer;transition:opacity .15s}
.dash-phase:hover{opacity:.85}
.dash-phase.accumulation{background:rgba(91,158,240,.08);border-color:rgba(91,158,240,.3)}
.dash-phase.intensification{background:rgba(232,197,71,.08);border-color:rgba(232,197,71,.3)}
.dash-phase.peak{background:rgba(232,84,84,.08);border-color:rgba(232,84,84,.3)}
.dash-phase.deload{background:rgba(61,214,140,.08);border-color:rgba(61,214,140,.3)}
.dash-phase-top{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.dash-phase-icon{font-size:24px}
.dash-phase-name{font-family:var(--font-display);font-size:20px;font-weight:900;letter-spacing:.08em}
.dash-phase.accumulation .dash-phase-name{color:var(--blue)}
.dash-phase.intensification .dash-phase-name{color:var(--accent)}
.dash-phase.peak .dash-phase-name{color:var(--red)}
.dash-phase.deload .dash-phase-name{color:var(--green)}
.dash-phase-desc{font-size:12px;color:var(--text2)}
.dash-phase-today{font-family:var(--font-display);font-size:13px;color:var(--text2);margin-top:8px}
.dash-phase-today strong{color:var(--text)}

/* 2-col widget grid */
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.dash-widget{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:14px;cursor:pointer;transition:border-color .15s}
.dash-widget:hover{border-color:var(--border2)}
.dw-label{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.dw-val{font-family:var(--font-display);font-size:32px;font-weight:900;color:var(--text);line-height:1}
.dw-sub{font-size:11px;color:var(--text3);margin-top:3px}
.dw-bar{height:4px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden}
.dw-bar-fill{height:100%;border-radius:2px;transition:width .4s}

/* Water quick add on dashboard */
.dash-water-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.dash-water-btn{flex:1;padding:10px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;font-family:var(--font-display);font-size:15px;font-weight:800;letter-spacing:.06em;cursor:pointer;transition:opacity .15s}
.dash-water-btn:hover{opacity:.85}
.dash-water-minus{width:40px;height:40px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* Supplement next window */
.dash-supp-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.dash-supp-row:last-child{border-bottom:none}
.dash-supp-name{font-size:13px;color:var(--text)}
.dash-supp-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .2s;flex-shrink:0}
.dash-supp-check.checked{background:var(--green);border-color:var(--green);color:white}

/* Sleep last night */
.dash-sleep-score{font-family:var(--font-display);font-size:48px;font-weight:900;color:var(--accent);line-height:1}
.dash-sleep-meta{font-size:12px;color:var(--text3);margin-top:4px}

/* ===================== WORKOUT ===================== */
.phase-banner{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--card-r);border:1px solid;margin-bottom:14px}
.phase-banner.accumulation{background:rgba(91,158,240,.08);border-color:rgba(91,158,240,.3)}
.phase-banner.intensification{background:rgba(232,197,71,.08);border-color:rgba(232,197,71,.3)}
.phase-banner.peak{background:rgba(232,84,84,.08);border-color:rgba(232,84,84,.3)}
.phase-banner.deload{background:rgba(61,214,140,.08);border-color:rgba(61,214,140,.3)}
.phase-icon{font-size:26px}
.phase-info{flex:1}
.phase-name{font-family:var(--font-display);font-size:20px;font-weight:900;letter-spacing:.08em;line-height:1}
.phase-banner.accumulation .phase-name{color:var(--blue)}
.phase-banner.intensification .phase-name{color:var(--accent)}
.phase-banner.peak .phase-name{color:var(--red)}
.phase-banner.deload .phase-name{color:var(--green)}
.phase-desc{font-size:11px;color:var(--text2);margin-top:2px}
.phase-week-info{text-align:right}
.phase-week-num{font-family:var(--font-display);font-size:24px;font-weight:800;color:var(--text);line-height:1}
.phase-week-label{font-size:10px;color:var(--text3);font-family:var(--font-display);letter-spacing:.08em}
.wave-dots{display:flex;gap:5px;margin-top:5px;justify-content:flex-end}
.wave-dot{width:8px;height:8px;border-radius:50%}

.day-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.day-tab{padding:6px 14px;font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text3);cursor:pointer;transition:all .15s}
.day-tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.day-tab.completed{border-color:var(--green);color:var(--green)}
.day-tab.completed.active{background:var(--green);color:var(--bg);border-color:var(--green)}

.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:14px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:10px 12px}
.stat-label{font-family:var(--font-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.stat-val{font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--text);line-height:1}
.stat-sub{font-size:10px;color:var(--text3);margin-top:2px}

.section-block{margin-bottom:14px}
.section-label{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:8px;border-left:2px solid var(--accent);padding-left:8px}

.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:14px 16px;margin-bottom:8px;transition:border-color .2s}
.ex-card.sig-up{border-color:var(--green)}
.ex-card.sig-warn{border-color:var(--orange)}
.ex-card.sig-deload{border-color:var(--green)}
.ex-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ex-name{font-family:var(--font-display);font-size:16px;font-weight:700;letter-spacing:.04em;color:var(--text);flex:1}
.badge{font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.08em;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.badge-compound{background:rgba(91,158,240,.15);color:var(--blue);border:1px solid rgba(91,158,240,.25)}
.badge-iso{background:rgba(232,197,71,.1);color:var(--accent2);border:1px solid rgba(232,197,71,.2)}
.badge-sets{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}

.phase-target-box{display:flex;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:6px;margin-bottom:10px;border:1px solid var(--border);background:var(--bg3);font-size:12px;color:var(--text2)}
.phase-target-box strong{color:var(--text)}

.prev-row{font-size:11px;color:var(--text3);margin-bottom:8px}
.prev-row strong{color:var(--text2)}

.rep-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.rep-range-label{font-size:10px;color:var(--text3);min-width:55px;font-family:var(--font-display)}
.rep-track{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.rep-fill{height:100%;border-radius:2px;transition:width .4s,background .3s}
.rep-count{font-family:var(--font-display);font-size:13px;font-weight:700;min-width:20px;text-align:right}

.input-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--font-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.field input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-display);font-size:17px;font-weight:600;padding:8px 10px;width:100%;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--accent)}
.field input::placeholder{color:var(--text3);font-weight:400}

.signal-box{display:flex;align-items:flex-start;gap:7px;padding:8px 10px;border-radius:6px;font-size:12px;line-height:1.4}
.signal-box.sig-up{background:rgba(61,214,140,.1);color:#3dd68c;border:1px solid rgba(61,214,140,.2)}
.signal-box.sig-hold{background:rgba(90,87,85,.15);color:var(--text2);border:1px solid var(--border)}
.signal-box.sig-warn{background:rgba(240,146,58,.1);color:var(--orange);border:1px solid rgba(240,146,58,.2)}
.signal-box.sig-deload{background:rgba(61,214,140,.08);color:var(--green);border:1px solid rgba(61,214,140,.2)}
.signal-box.sig-new{background:rgba(91,158,240,.1);color:var(--blue);border:1px solid rgba(91,158,240,.2)}

.hist-toggle{font-size:11px;color:var(--text3);cursor:pointer;margin-top:6px;display:inline-flex;align-items:center;gap:3px;text-decoration:underline}
.hist-box{margin-top:6px;padding:8px 10px;background:var(--bg3);border-radius:6px;border:1px solid var(--border)}
.hist-row{display:grid;grid-template-columns:50px 65px 55px 1fr;font-size:11px;color:var(--text2);padding:3px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-row .wk{color:var(--text3);font-family:var(--font-display)}
.hist-ph{font-size:10px;padding:1px 5px;border-radius:3px;font-family:var(--font-display);font-weight:600}
.ph-acc{background:rgba(91,158,240,.15);color:var(--blue)}
.ph-int{background:rgba(232,197,71,.15);color:var(--accent)}
.ph-peak{background:rgba(232,84,84,.15);color:var(--red)}
.ph-dl{background:rgba(61,214,140,.15);color:var(--green)}

.complete-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn-save{flex:1;padding:10px 20px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;font-family:var(--font-display);font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.btn-save:hover{opacity:.85}
.btn-save:disabled{opacity:.4;cursor:not-allowed}
.btn-complete{flex:1;padding:10px 20px;background:transparent;color:var(--green);border:1px solid var(--green);border-radius:8px;font-family:var(--font-display);font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-complete:hover{background:rgba(61,214,140,.1)}

/* ===================== WATER ===================== */
.water-hero{text-align:center;padding:24px 16px}
.water-count{font-family:var(--font-display);font-size:80px;font-weight:900;color:var(--text);line-height:1}
.water-target-label{font-size:14px;color:var(--text3);margin-top:4px}
.water-progress-track{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;margin:16px 0}
.water-progress-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--blue),var(--green));transition:width .4s}
.water-actions{display:grid;grid-template-columns:56px 1fr;gap:10px;margin-bottom:16px}
.water-minus{background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text2);font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;height:54px}
.water-minus:hover{border-color:var(--border2)}
.water-plus{background:var(--accent);color:var(--bg);border:none;border-radius:10px;font-family:var(--font-display);font-size:17px;font-weight:800;letter-spacing:.06em;cursor:pointer;height:54px;transition:opacity .15s}
.water-plus:hover{opacity:.85}
.water-status{text-align:center;font-size:13px;color:var(--text3);margin-bottom:16px}
.water-status.good{color:var(--green)}
.water-history-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.water-history-row:last-child{border-bottom:none}
.whr-date{font-size:13px;color:var(--text2)}
.whr-val{font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text)}
.whr-bar{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:0 12px}
.whr-fill{height:100%;background:var(--blue);border-radius:2px}
.water-target-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.water-target-label2{font-size:13px;color:var(--text2)}
.water-target-input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-display);font-size:16px;font-weight:700;padding:6px 10px;width:60px;text-align:center}
.water-target-input:focus{outline:none;border-color:var(--accent)}

/* ===================== SUPPLEMENTS ===================== */
.supp-ticker{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);margin-bottom:12px;font-size:12px;color:var(--text2)}
.supp-ticker.status-missed{border-color:rgba(232,84,84,.4);background:rgba(232,84,84,.06)}
.supp-ticker.status-low{border-color:rgba(240,146,58,.4);background:rgba(240,146,58,.06)}
.supp-progress{font-family:var(--font-display);font-size:11px;color:var(--text3);margin-left:auto;white-space:nowrap}

.supp-window{margin-bottom:14px}
.supp-window-header{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.supp-window-icon{font-size:16px}
.supp-window-title{font-family:var(--font-display);font-size:14px;font-weight:700;color:var(--text)}
.supp-window-time{font-size:11px;color:var(--text3)}

.supp-item{display:grid;grid-template-columns:32px 1fr auto auto;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--bg3);margin-bottom:6px;border:1px solid transparent;transition:all .2s}
.supp-item.taken{background:rgba(61,214,140,.06)}
.supp-item.taken .supp-name{text-decoration:line-through;color:var(--text3)}
.supp-item.missed{border-color:rgba(232,84,84,.4);animation:pulse-red 1.5s ease-in-out infinite}
.supp-item.taken.missed{animation:none;border-color:transparent}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(232,84,84,.4)}50%{box-shadow:0 0 0 6px rgba(232,84,84,0)}}
.supp-check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:all .2s;flex-shrink:0}
.supp-check:hover{border-color:var(--green)}
.supp-check.checked{background:var(--green);border-color:var(--green);color:white}
.supp-body{min-width:0}
.supp-name{font-size:13px;font-weight:600;color:var(--text);line-height:1.2}
.supp-meta{font-size:11px;color:var(--text3);margin-top:2px}
.supp-low-btn{font-size:10px;padding:4px 8px;border-radius:5px;border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;font-family:var(--font-display);white-space:nowrap;transition:all .15s}
.supp-low-btn.is-low{background:rgba(240,146,58,.1);border-color:rgba(240,146,58,.4);color:var(--orange)}
.supp-del{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.supp-del:hover{border-color:var(--red);color:var(--red)}

.supp-add-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:14px;margin-bottom:12px}

<script>
// ============================================================
// SUPABASE
// ============================================================
const SUPA_URL='https://eubasgfirmupygxzhjeo.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1YmFzZ2Zpcm11cHlneHpoamVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NjcxOTQsImV4cCI6MjA5NDU0MzE5NH0.9Zpf6uCfTsygVFmHZepTHpdb9GPa6-GWSgIJHd_E52w';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);

// ============================================================
// GLOBAL STATE
// ============================================================
let currentTab='dashboard';
let DB={};
let currentWeek=1;
let completedDays=new Set();
let currentWorkoutDay=0;
let workoutInputs={};
let workoutChartFilter='all';
let workoutCharts={};

let waterCount=0;
let waterTarget=8;
let waterHistory=[];

let suppStack=[];
let suppTaken=new Set();

let sleepLogs=[];
let sleepView='dashboard';
let sleepDetailId=null;

// ============================================================
// WAVE PERIODIZATION
// ============================================================
const PHASES={
  1:{key:'accumulation',name:'ACCUMULATION',icon:'📦',desc:'High volume · RPE 8',setMod:+1,repRange:[8,10],color:'var(--blue)'},
  2:{key:'intensification',name:'INTENSIFICATION',icon:'⚡',desc:'Push weight up · RPE 9',setMod:0,repRange:[6,8],color:'var(--accent)'},
  3:{key:'peak',name:'PEAK',icon:'🔥',desc:'Max intensity · RPE 10+',setMod:-1,repRange:[5,7],color:'var(--red)'},
  4:{key:'deload',name:'DELOAD',icon:'🌊',desc:'60% weight · recover',setMod:-1,repRange:[10,15],color:'var(--green)'}
};
function getPhase(w){const pos=((w-1)%4)+1;return{...PHASES[pos],weekInCycle:pos,globalWeek:w};}
function getWaveNum(w){return Math.ceil(w/4);}

// ============================================================
// PROGRAM
// ============================================================
const COMPOUND=["Squats","RDLs","T-bar row","Seated close grip row","Seated wide grip row","Iso-lateral high row","Pulldown / pull-up","Shoulder press","Incline DB press","Incline machine","Dips","JM press","Rope pullover"];
const DAYS=[
  {key:"anterior",label:"Anterior",sections:[
    {title:"chest",ex:[{n:"Incline DB press",s:2,compound:true},{n:"Chest fly",s:3,compound:false},{n:"Low-to-High Cable fly",s:3,compound:false}]},
    {title:"biceps",ex:[{n:"Preacher curl",s:2,compound:false}]},

  ]},
  {key:"upper",label:"Modified Upper",sections:[
    {title:"shoulders",ex:[{n:"Shoulder press",s:2,compound:true},{n:"Lateral raises",s:2,compound:false}]},
    {title:"back",ex:[{n:"Seated wide grip row",s:2,compound:true},{n:"Incline machine",s:2,compound:true},{n:"Iso-lateral high row",s:2,compound:true},{n:"Rope pullover",s:2,compound:false}]},
    {title:"triceps",ex:[{n:"Dips",s:2,compound:true}]}
  ]},
  {key:"lower",label:"Modified Lower",sections:[
    {title:"quads",ex:[{n:"Squats",s:3,compound:true},{n:"Leg extension",s:2,compound:false}]},
    {title:"hamstrings",ex:[{n:"Lying leg curl",s:2,compound:false}]},
    {title:"calves / accessories",ex:[{n:"Standing calf raises",s:2,compound:false},{n:"Adductors",s:2,compound:false}]}
  ]},
  {key:"arms",label:"Arms",sections:[
    {title:"biceps",ex:[{n:"Seated incline curl",s:2,compound:false},{n:"Behind back cable curl",s:2,compound:false},{n:"Hammer curl",s:2,compound:false}]},
    {title:"triceps",ex:[{n:"JM press",s:2,compound:true},{n:"Single arm tricep pushdown",s:2,compound:false}]}
  ]}
];
const ALL_EX=DAYS.flatMap(d=>d.sections.flatMap(s=>s.ex.map(e=>({...e,dayKey:d.key,dayLabel:d.label}))));

// ============================================================
// SUPPLEMENT DATABASE (subset)
// ============================================================
const SUPP_WINDOWS=[
  {key:'morning',icon:'🌅',title:'Morning',time:'On wake'},
  {key:'preworkout',icon:'⚡',title:'Pre-Workout',time:'30–45 min before'},
  {key:'postworkout',icon:'💪',title:'Post-Workout',time:'Within 30 min after'},
  {key:'evening',icon:'🌙',title:'Evening',time:'1–2 hrs before bed'},
  {key:'withfood',icon:'🍽️',title:'With Food',time:'Any meal'}
];
const SUPP_DB=[
  {name:'Creatine Monohydrate',icon:'⚡',dose:'5g',timing:'postworkout',note:'Load or maintain phase'},
  {name:'Magnesium Glycinate',icon:'🧲',dose:'400mg',timing:'evening',note:'Sleep & recovery'},
  {name:'Zinc',icon:'🔩',dose:'25mg',timing:'evening',note:'Take away from iron'},
  {name:'Vitamin B Complex',icon:'🅱️',dose:'1 tablet',timing:'morning',note:'With food'},
  {name:'Whey Protein',icon:'🥤',dose:'30g',timing:'postworkout',note:'Post-training window'},
  {name:'Caffeine',icon:'☕',dose:'200mg',timing:'preworkout',note:'Avoid after 2pm'},
  {name:'Omega-3',icon:'🐟',dose:'2g',timing:'withfood',note:'With largest meal'},
  {name:'Vitamin D3',icon:'☀️',dose:'2000IU',timing:'morning',note:'With fat-containing meal'},
  {name:'Ashwagandha',icon:'🌿',dose:'600mg',timing:'evening',note:'KSM-66 form preferred'},
  {name:'L-Citrulline',icon:'🩸',dose:'6g',timing:'preworkout',note:'Pump & endurance'},
  {name:'Beta-Alanine',icon:'🔥',dose:'3.2g',timing:'preworkout',note:'Tingles are normal'},
  {name:'L-Theanine',icon:'🍵',dose:'200mg',timing:'preworkout',note:'Stack with caffeine'},
  {name:'Melatonin',icon:'😴',dose:'0.5mg',timing:'evening',note:'Low dose is enough'},
  {name:'Collagen Peptides',icon:'💪',dose:'10g',timing:'withfood',note:'Tendons & joints'},
  {name:'Vitamin C',icon:'🍊',dose:'500mg',timing:'morning',note:'Antioxidant support'},
];

function ik(n){return n.replace(/[\s\/\-]+/g,'_');}
function today(){return new Date().toISOString().slice(0,10);}
function fmtMins(m){if(!m)return'—';const h=Math.floor(m/60),mn=m%60;return h>0?`${h}h ${mn}m`:`${mn}m`;}

// ============================================================
// SUPABASE LOAD ALL
// ============================================================
async function loadAll(){
  const [sessions,state,water,waterH,suppStackR,suppTakenR,sleepR]=await Promise.all([
    supa.from('sessions').select('*'),
    supa.from('tracker_state').select('*').eq('id',1).single(),
    supa.from('water_logs').select('*').eq('date',today()).single(),
    supa.from('water_logs').select('*').order('date',{ascending:false}).limit(14),
    supa.from('supplement_stack').select('*').order('sort_order'),
    supa.from('supplement_taken').select('*').eq('date',today()),
    supa.from('sleep_logs').select('*').order('date',{ascending:false})
  ]);

  DB={};
  (sessions.data||[]).forEach(r=>{DB[`${r.day_key}||${r.exercise}||w${r.week}`]={weight:r.weight,reps:r.reps};});

  if(!state.error&&state.data){
    currentWeek=state.data.current_week||1;
    completedDays=new Set(state.data.completed_days||[]);
  }

  if(!water.error&&water.data){waterCount=water.data.count||0;waterTarget=water.data.target||8;}
  waterHistory=(waterH.data||[]).filter(r=>r.date!==today());

  suppStack=(suppStackR.data||[]);
  suppTaken=new Set((suppTakenR.data||[]).map(r=>r.item_id));

  sleepLogs=(sleepR.data||[]);
}

// ============================================================
// SAVE STATUS
// ============================================================
function setSaveStatus(type,text){
  const el=document.getElementById('saveStatus');
  const tx=document.getElementById('saveStatusText');
  el.className='save-status '+type;
  tx.textContent=text;
  if(type==='saved')setTimeout(()=>{el.className='save-status';tx.textContent='ready';},2500);
}
function showToast(msg,bg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=bg||'var(--green)';
  t.style.color=bg?'white':'var(--bg)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('nav-'+tab).classList.add('active');
  document.getElementById('page-'+tab).scrollTop=0;
  if(tab==='dashboard')renderDashboard();
  else if(tab==='workout')renderWorkout();
  else if(tab==='water')renderWater();
  else if(tab==='supplements')renderSupplements();
  else if(tab==='sleep')renderSleepTab();
}

// ============================================================
// DASHBOARD
// ============================================================
function renderDashboard(){
  const phase=getPhase(currentWeek);
  const nextDay=DAYS.find(d=>!completedDays.has(d.key));
  const lastSleep=sleepLogs[0];
  const sleepScore=lastSleep?calcSleepScore(lastSleep):null;
  const suppTotal=suppStack.length;
  const suppDone=suppStack.filter(s=>suppTaken.has(s.id)).length;
  const waterPct=Math.min(100,Math.round((waterCount/waterTarget)*100));

  document.getElementById('dashContent').innerHTML=`
    <div class="dash-greeting">GM, Ahmed 👋</div>
    <div class="dash-date">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>

    <div class="dash-phase ${phase.key}" onclick="switchTab('workout')">
      <div class="dash-phase-top">
        <div class="dash-phase-icon">${phase.icon}</div>
        <div class="dash-phase-name">${phase.name}</div>
        <div style="margin-left:auto;font-family:var(--font-display);font-size:11px;color:var(--text3)">Wave ${getWaveNum(currentWeek)} · Wk ${currentWeek}</div>
      </div>
      <div class="dash-phase-desc">${phase.desc}</div>
      <div class="dash-phase-today">Today: <strong>${nextDay?nextDay.label+' Day':'All days complete this week 🎉'}</strong> · ${completedDays.size}/5 days done</div>
    </div>

    <div class="dash-grid">
      <div class="dash-widget" onclick="switchTab('water')">
        <div class="dw-label">💧 Water</div>
        <div class="dw-val">${waterCount}<span style="font-size:16px;color:var(--text3)">/${waterTarget}</span></div>
        <div class="dw-sub">bottles today</div>
        <div class="dw-bar"><div class="dw-bar-fill" style="width:${waterPct}%;background:var(--blue)"></div></div>
        <div class="dash-water-row">
          <button class="dash-water-minus" onclick="event.stopPropagation();dashWaterMinus()">−</button>
          <button class="dash-water-btn" onclick="event.stopPropagation();dashWaterPlus()">+ Bottle</button>
        </div>
      </div>
      <div class="dash-widget" onclick="switchTab('sleep')">
        <div class="dw-label">🌙 Last Night</div>
        ${lastSleep?`
          <div class="dw-val" style="color:${sleepScore>=80?'var(--green)':sleepScore>=65?'var(--accent)':'var(--red)'}">${sleepScore}</div>
          <div class="dw-sub">sleep score</div>
          <div style="font-size:11px;color:var(--text3);margin-top:6px">${fmtMins(lastSleep.total_sleep)} · Deep ${lastSleep.deep_pct}% · REM ${lastSleep.rem_pct}%</div>
        `:`<div class="dw-val" style="color:var(--text3)">—</div><div class="dw-sub">no data yet</div>`}
      </div>
    </div>

    <div class="card" onclick="switchTab('supplements')" style="cursor:pointer">
      <div class="card-title">💊 Supplements — ${suppDone}/${suppTotal} taken</div>
      ${suppStack.length===0?'<div style="font-size:12px;color:var(--text3)">No supplements added yet.</div>':
        suppStack.slice(0,4).map(s=>`
          <div class="dash-supp-row">
            <span class="dash-supp-name">${s.name} <span style="font-size:11px;color:var(--text3)">${s.dose||''}</span></span>
            <button class="dash-supp-check ${suppTaken.has(s.id)?'checked':''}" onclick="event.stopPropagation();dashToggleSupp('${s.id}')">${suppTaken.has(s.id)?'✓':''}</button>
          </div>`).join('')
      }

    </div>
  `;
}

// WORKOUT
// ============================================================
function dbKey(w,dk,n){return`${dk}||${n}||w${w}`;}
function dbGet(w,dk,n){return DB[dbKey(w,dk,n)]||null;}
function dbSet(w,dk,n,d){DB[dbKey(w,dk,n)]=d;}
function getPast(dk,n,limit=10){
  let arr=[];
  for(let w=currentWeek-1;w>=1&&arr.length<limit;w--){const d=dbGet(w,dk,n);if(d)arr.push({week:w,phase:getPhase(w),...d});}
  return arr;
}
function getPeakWeight(dk,n){
  let peak=0;
  for(let w=1;w<currentWeek;w++){const ph=getPhase(w);if(ph.weekInCycle===3){const d=dbGet(w,dk,n);if(d&&parseFloat(d.weight)>peak)peak=parseFloat(d.weight);}}
  return peak;
}
function getLastWeight(dk,n){for(let w=currentWeek-1;w>=1;w--){const d=dbGet(w,dk,n);if(d&&d.weight)return parseFloat(d.weight);}return null;}
function getAllData(dk,n){
  let arr=[];
  for(let w=1;w<=200;w++){const d=dbGet(w,dk,n);if(d&&d.weight)arr.push({week:w,phase:getPhase(w).key,weight:parseFloat(d.weight)||0,reps:parseInt(d.reps)||0});}
  return arr;
}
function getPhaseTarget(ex,dk,phase){
  const[rMin,rMax]=phase.repRange;
  let sets=ex.s;
  if(ex.compound)sets=Math.max(1,sets+phase.setMod);
  let targetWeight=null;
  const lastW=getLastWeight(dk,ex.n);
  if(phase.weekInCycle===4){const peak=getPeakWeight(dk,ex.n);const base=peak>0?peak:(lastW||0);targetWeight=base>0?Math.round((base*.6)/2.5)*2.5:null;}
  else if(phase.weekInCycle===1)targetWeight=lastW;
  else if(phase.weekInCycle===2)targetWeight=lastW?lastW+2.5:null;
  else if(phase.weekInCycle===3)targetWeight=lastW?lastW+5:null;
  return{sets,rMin,rMax,targetWeight};
}
function getSignal(dk,n,ex,inp,phase){
  const target=getPhaseTarget(ex,dk,phase);
  const curReps=parseInt(inp?.reps)||0;
  const past=getPast(dk,n,1);
  const prev=past[0];
  if(phase.weekInCycle===4){
    if(curReps===0)return{type:'deload',msg:`Deload — target ${target.targetWeight?target.targetWeight+'kg':'60% of peak'}. ${target.rMin}–${target.rMax} reps, ${target.sets} sets.`};
    return{type:'deload',msg:`Deload week. Focus on form and recovery.`};
  }
  if(!prev&&curReps===0)return{type:'new',msg:`First session — log your baseline.`};
  if(curReps===0)return{type:'hold',msg:`${phase.name} — ${target.rMin}–${target.rMax} reps, ${target.sets} sets.${target.targetWeight?' Target: '+target.targetWeight+' kg':''}`};
  if(curReps>=target.rMax)return{type:'up',msg:`${curReps} reps — top of range! Add weight next session.`};
  if(curReps>=target.rMin)return{type:'hold',msg:`${curReps} reps — inside range. Build to ${target.rMax}.`};
  return{type:'warn',msg:`${curReps} reps — below ${target.rMin} target. Check form or hold weight.`};
}
function sigClass(t){return{up:'sig-up',hold:'sig-hold',warn:'sig-warn',deload:'sig-deload',new:'sig-new'}[t]||'sig-hold';}
function sigIcon(t){return{up:'↑',hold:'→',warn:'⚠',deload:'🌊',new:'●'}[t]||'→';}
function phClass(k){return{accumulation:'ph-acc',intensification:'ph-int',peak:'ph-peak',deload:'ph-dl'}[k]||'';}
function phLabel(k){return{accumulation:'ACC',intensification:'INT',peak:'PEAK',deload:'DL'}[k]||k;}

function repBarHTML(n,reps,phase){
  const[rMin,rMax]=phase.repRange;
  const pct=reps>0?Math.min(100,Math.round((reps/rMax)*100)):0;
  const color=reps>=rMax?'var(--green)':reps>=rMin?'var(--orange)':reps>0?'var(--red)':'var(--border)';
  const cc=reps>=rMax?'var(--green)':reps>=rMin?'var(--orange)':reps>0?'var(--red)':'var(--text3)';
  return`<div class="rep-bar-wrap"><span class="rep-range-label">${rMin}–${rMax}</span><div class="rep-track"><div class="rep-fill" style="width:${pct}%;background:${color}"></div></div><span class="rep-count" style="color:${cc}">${reps>0?reps:'—'}</span></div>`;
}

function renderWorkout(){
  const phase=getPhase(currentWeek);
  const day=DAYS[currentWorkoutDay];
  const allEx=day.sections.flatMap(s=>s.ex);
  const totalSets=allEx.reduce((a,e)=>{let s=e.s;if(e.compound)s=Math.max(1,s+phase.setMod);return a+s;},0);
  const filled=allEx.filter(e=>workoutInputs[ik(e.n)]?.weight).length;
  const sigs=allEx.map(e=>getSignal(day.key,e.n,e,workoutInputs[ik(e.n)],phase).type);
  const upC=sigs.filter(s=>s==='up').length;
  const dotColors=['var(--blue)','var(--accent)','var(--red)','var(--green)'];
  const waveDots=[1,2,3,4].map((i)=>{
    const active=i===phase.weekInCycle;
    const c=dotColors[i-1];
    return`<div class="wave-dot" style="background:${i<=phase.weekInCycle?c:'var(--border)'};${active?'box-shadow:0 0 0 2px var(--bg2),0 0 0 3px '+c:''}"></div>`;
  }).join('');

  let tabsHTML=DAYS.map((d,i)=>{
    const done=completedDays.has(d.key);
    return`<button class="day-tab ${i===currentWorkoutDay?'active':''} ${done?'completed':''}" onclick="switchWorkoutDay(${i})">${d.label}${done?' ✓':''}</button>`;
  }).join('');

  let exHTML='';
  day.sections.forEach(sec=>{
    exHTML+=`<div class="section-block"><div class="section-label">${sec.title}</div>`;
    sec.ex.forEach(ex=>{
      const key=ik(ex.n);
      const inp=workoutInputs[key]||{};
      const sig=getSignal(day.key,ex.n,ex,inp,phase);
      const reps=parseInt(inp.reps)||0;
      const target=getPhaseTarget(ex,day.key,phase);
      const past=getPast(day.key,ex.n,5);
      const prev=past[0];
      const prevText=prev?`Wk${prev.week}: <strong>${prev.weight||'—'}kg</strong> × <strong>${prev.reps||'—'} reps</strong>`:'no previous data';
      const histRows=past.map(h=>`<div class="hist-row"><span class="wk">Wk${h.week}</span><span class="hist-ph ${phClass(h.phase.key)}">${phLabel(h.phase.key)}</span><span>${h.weight||'—'}kg</span><span>${h.reps||'—'}reps</span></div>`).join('');
      exHTML+=`<div class="ex-card ${sigClass(sig.type)}" id="wcard_${key}">
        <div class="ex-top">
          <span class="ex-name">${ex.n}</span>
          <span class="badge ${ex.compound?'badge-compound':'badge-iso'}">${ex.compound?'compound':'iso'}</span>
          <span class="badge badge-sets">${target.sets}s</span>
        </div>
        <div class="phase-target-box">
          🎯 <strong>${target.rMin}–${target.rMax} reps</strong> · <strong>${target.sets} sets</strong>${target.targetWeight?` · Target <strong>${target.targetWeight}kg</strong>`:''}
        </div>
        <div class="prev-row">${prevText}</div>
        <div id="wbar_${key}">${repBarHTML(ex.n,reps,phase)}</div>
        <div class="input-row">
          <div class="field"><label>Weight (kg)</label><input type="number" step="0.5" placeholder="kg" value="${inp.weight||''}" oninput="wUpd('${key}','weight',this.value,'${day.key}','${ex.n}')"></div>
          <div class="field"><label>Reps to failure</label><input type="number" placeholder="${target.rMin}–${target.rMax}" value="${inp.reps||''}" oninput="wUpd('${key}','reps',this.value,'${day.key}','${ex.n}')"></div>
        </div>
        <div class="signal-box ${sigClass(sig.type)}" id="wsig_${key}"><span>${sigIcon(sig.type)}</span><span>${sig.msg}</span></div>
        ${past.length>0?`<div class="hist-toggle" onclick="toggleHist('whb_${key}')">▾ history (${past.length})</div><div id="whb_${key}" style="display:none" class="hist-box">${histRows}</div>`:''}
      </div>`;
    });
    exHTML+='</div>';
  });

  document.getElementById('workoutContent').innerHTML=`
    <div class="phase-banner ${phase.key}">
      <div class="phase-icon">${phase.icon}</div>
      <div class="phase-info">
        <div class="phase-name">${phase.name}</div>
        <div class="phase-desc">${phase.desc}</div>
      </div>
      <div class="phase-week-info">
        <div class="phase-week-num">${currentWeek}</div>
        <div class="phase-week-label">Wave ${getWaveNum(currentWeek)}</div>
        <div class="wave-dots">${waveDots}</div>
      </div>
    </div>
    <div class="day-tabs">${tabsHTML}</div>
    <div class="stats-strip">
      <div class="stat-card"><div class="stat-label">Sets</div><div class="stat-val">${totalSets}</div><div class="stat-sub">today</div></div>
      <div class="stat-card"><div class="stat-label">Logged</div><div class="stat-val">${filled}/${allEx.length}</div><div class="stat-sub">exercises</div></div>
      <div class="stat-card"><div class="stat-label">On target</div><div class="stat-val" style="color:var(--green)">${upC}</div><div class="stat-sub">exercises</div></div>
      <div class="stat-card"><div class="stat-label">Days done</div><div class="stat-val" style="color:var(--purple)">${completedDays.size}/5</div><div class="stat-sub">this week</div></div>
    </div>
    ${exHTML}
    <div class="complete-row">
      <button class="btn-save" id="wSaveBtn" onclick="saveWorkoutSession()">✓ Save Session</button>
      <button class="btn-complete" onclick="completeWorkoutDay()">✓ Complete Day</button>
    </div>
    <div style="margin-top:20px">
      <div class="card-title" style="margin-bottom:10px">PROGRESSION GRAPHS</div>
      <div class="filter-row" id="wFilterRow"></div>
      <div class="graph-grid" id="wGraphGrid"></div>
    </div>
  `;
  buildWorkoutFilterRow();
  buildWorkoutGraphs();
}

function switchWorkoutDay(i){currentWorkoutDay=i;workoutInputs={};renderWorkout();}
function toggleHist(id){const el=document.getElementById(id);if(el)el.style.display=el.style.display==='none'?'block':'none';}

function wUpd(key,field,val,dk,exName){
  if(!workoutInputs[key])workoutInputs[key]={};
  workoutInputs[key][field]=val;
  const phase=getPhase(currentWeek);
  const day=DAYS[currentWorkoutDay];
  const ex=day.sections.flatMap(s=>s.ex).find(e=>ik(e.n)===key);
  if(!ex)return;
  const inp=workoutInputs[key];
  const reps=parseInt(inp.reps)||0;
  const sig=getSignal(dk,exName,ex,inp,phase);
  const sigEl=document.getElementById('wsig_'+key);
  if(sigEl){sigEl.className='signal-box '+sigClass(sig.type);sigEl.innerHTML=`<span>${sigIcon(sig.type)}</span><span>${sig.msg}</span>`;}
  const barEl=document.getElementById('wbar_'+key);
  if(barEl)barEl.innerHTML=repBarHTML(exName,reps,phase);
  const card=document.getElementById('wcard_'+key);
  if(card)card.className='ex-card '+sigClass(sig.type);
}

async function saveWorkoutSession(){
  const day=DAYS[currentWorkoutDay];
  const toSave=[];
  day.sections.flatMap(s=>s.ex).forEach(ex=>{const key=ik(ex.n);if(workoutInputs[key]?.weight)toSave.push({ex,key,inp:workoutInputs[key]});});
  if(toSave.length===0){showToast('Enter at least one weight first','var(--orange)');return;}
  const btn=document.getElementById('wSaveBtn');
  btn.disabled=true;setSaveStatus('saving','saving...');
  try{
    await Promise.all(toSave.map(({ex,inp})=>supa.from('sessions').upsert({week:currentWeek,day_key:day.key,exercise:ex.n,weight:parseFloat(inp.weight),reps:parseInt(inp.reps)},{onConflict:'week,day_key,exercise'})));
    toSave.forEach(({ex,inp})=>dbSet(currentWeek,day.key,ex.n,inp));
    workoutInputs={};
    setSaveStatus('saved','saved');
    showToast(`${toSave.length} exercises saved`);
    renderWorkout();
  }catch(e){setSaveStatus('error','error');showToast('Save failed','var(--red)');console.error(e);}
  btn.disabled=false;
}

async function completeWorkoutDay(){
  const day=DAYS[currentWorkoutDay];
  completedDays.add(day.key);
  if(completedDays.size>=5){currentWeek++;completedDays=new Set();showToast(`Week done! Week ${currentWeek} — ${getPhase(currentWeek).name} 🎯`);}
  else{const next=DAYS.findIndex((d,i)=>i!==currentWorkoutDay&&!completedDays.has(d.key));if(next!==-1)currentWorkoutDay=next;showToast(`${day.label} complete! ${5-completedDays.size} days left.`);}
  workoutInputs={};
  setSaveStatus('saving','saving...');
  await supa.from('tracker_state').upsert({id:1,current_week:currentWeek,completed_days:[...completedDays]},{onConflict:'id'});
  setSaveStatus('saved','saved');
  renderWorkout();
  if(currentTab==='dashboard')renderDashboard();
}

function buildWorkoutFilterRow(){
  const filters=[{key:'all',label:'All'},{key:'compound',label:'Compound'},{key:'isolation',label:'Iso'},...DAYS.map(d=>({key:d.key,label:d.label}))];
  document.getElementById('wFilterRow').innerHTML=filters.map(f=>`<button class="filter-btn ${workoutChartFilter===f.key?'active':''}" onclick="setWorkoutFilter('${f.key}')">${f.label}</button>`).join('');
}
function setWorkoutFilter(k){workoutChartFilter=k;buildWorkoutFilterRow();buildWorkoutGraphs();}

function buildWorkoutGraphs(){
  Object.values(workoutCharts).forEach(c=>c.destroy());workoutCharts={};
  const grid=document.getElementById('wGraphGrid');
  if(!grid)return;
  const filteredEx=workoutChartFilter==='all'?ALL_EX:workoutChartFilter==='compound'?ALL_EX.filter(e=>e.compound):workoutChartFilter==='isolation'?ALL_EX.filter(e=>!e.compound):ALL_EX.filter(e=>e.dayKey===workoutChartFilter);
  const withData=filteredEx.filter(e=>getAllData(e.dayKey,e.n).length>0);
  if(withData.length===0){grid.innerHTML=`<div class="no-data">Log sessions to see graphs.</div>`;return;}
  grid.innerHTML=withData.map(e=>`<div class="graph-card"><div class="graph-card-title">${e.n}</div><div class="graph-card-meta"><span><span class="graph-dot" style="background:var(--accent)"></span> kg</span><span><span class="graph-dot" style="background:var(--blue)"></span> reps</span><span style="color:var(--text3)">${e.dayLabel}</span></div><canvas id="gc_${ik(e.dayKey)}_${ik(e.n)}" height="140"></canvas></div>`).join('');
  withData.forEach(e=>{
    const data=getAllData(e.dayKey,e.n);
    const id=`gc_${ik(e.dayKey)}_${ik(e.n)}`;
    const ctx=document.getElementById(id);
    if(!ctx)return;
    const ptColors=data.map(d=>({accumulation:'var(--blue)',intensification:'var(--accent)',peak:'var(--red)',deload:'var(--green)'}[d.phase]||'var(--accent)'));
    workoutCharts[id]=new Chart(ctx,{type:'line',data:{labels:data.map(d=>`W${d.week}`),datasets:[{label:'kg',data:data.map(d=>d.weight),borderColor:'rgba(232,197,71,.9)',backgroundColor:'rgba(232,197,71,.08)',tension:.35,pointRadius:4,pointBackgroundColor:ptColors,yAxisID:'y',fill:true},{label:'reps',data:data.map(d=>d.reps),borderColor:'rgba(91,158,240,.8)',backgroundColor:'transparent',tension:.35,pointRadius:3,pointBackgroundColor:'rgba(91,158,240,1)',yAxisID:'y2',borderDash:[4,3]}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1a1e',borderColor:'#2a2a2e',borderWidth:1,titleColor:'#f0ede8',bodyColor:'#9a9793',callbacks:{title:items=>`Week ${data[items[0].dataIndex].week} — ${phLabel(data[items[0].dataIndex].phase)}`}}},scales:{x:{ticks:{color:'#5a5755',font:{family:'Barlow Condensed',size:10}},grid:{color:'rgba(42,42,46,.5)'}},y:{position:'left',ticks:{color:'#e8c547',font:{family:'Barlow Condensed',size:10}},grid:{color:'rgba(42,42,46,.5)'}},y2:{position:'right',ticks:{color:'#5b9ef0',font:{family:'Barlow Condensed',size:10}},grid:{drawOnChartArea:false}}}}});
  });
}

async function saveWater(){
  setSaveStatus('saving','saving...');
  await supa.from('water_logs').upsert({date:today(),count:waterCount,target:waterTarget},{onConflict:'date'});
  setSaveStatus('saved','saved');
}

function renderWater(){
  const pct=Math.min(100,Math.round((waterCount/waterTarget)*100));
  const ml=waterCount*500;
  const targetMl=waterTarget*500;
  const status=pct>=100?'🎯 Daily target reached!':pct>=75?'💧 Almost there!':pct>=50?'Keep going!':'Start drinking!';
  const histHTML=waterHistory.length===0?'<div style="font-size:12px;color:var(--text3);text-align:center;padding:16px">No history yet</div>':waterHistory.slice(0,7).map(r=>{const p=Math.min(100,Math.round(((r.count||0)/(r.target||8))*100));return`<div class="water-history-row"><div class="whr-date">${r.date.slice(5)}</div><div class="whr-bar"><div class="whr-fill" style="width:${p}%"></div></div><div class="whr-val">${r.count||0}/${r.target||8}</div></div>`;}).join('');

  document.getElementById('waterContent').innerHTML=`
    <div class="water-hero">
      <div class="water-count">${waterCount}</div>
      <div class="water-target-label">of ${waterTarget} bottles · ${ml}ml / ${targetMl}ml</div>
      <div class="water-progress-track"><div class="water-progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="water-actions">
      <button class="water-minus" onclick="waterMinus()" ${waterCount===0?'disabled':''}>−</button>
      <button class="water-plus" onclick="waterPlus()">+ Add Bottle (500ml)</button>
    </div>
    <div class="water-status ${pct>=100?'good':''}">${status}</div>
    <div class="card">
      <div class="card-title">Daily Target</div>
      <div class="water-target-row">
        <div class="water-target-label2">Bottles per day</div>
        <input class="water-target-input" type="number" min="1" max="20" value="${waterTarget}" onchange="updateWaterTarget(this.value)">
      </div>
    </div>
    <div class="card">
      <div class="card-title">Last 7 Days</div>
      ${histHTML}
    </div>
  `;
}

async function waterPlus(){waterCount++;await saveWater();renderWater();if(currentTab==='dashboard')renderDashboard();}
async function waterMinus(){if(waterCount<=0)return;waterCount--;await saveWater();renderWater();if(currentTab==='dashboard')renderDashboard();}
async function updateWaterTarget(v){waterTarget=Math.max(1,parseInt(v)||8);await saveWater();renderWater();}

async function toggleSuppTaken(id){
  const date=today();
  if(suppTaken.has(id)){
    suppTaken.delete(id);
    await supa.from('supplement_taken').delete().eq('date',date).eq('item_id',id);
  }else{
    suppTaken.add(id);
    await supa.from('supplement_taken').upsert({date,item_id:id},{onConflict:'date,item_id'});
  }
}

async function saveSuppStack(){
  setSaveStatus('saving','saving...');
  await supa.from('supplement_stack').upsert(suppStack.map((s,i)=>({...s,sort_order:i})));
  setSaveStatus('saved','saved');
}

function renderSupplements(){
  const total=suppStack.length;
  const done=suppStack.filter(s=>suppTaken.has(s.id)).length;
  const pct=total>0?Math.round((done/total)*100):0;
  const hasMissed=suppStack.some(s=>{const win=SUPP_WINDOWS.find(w=>w.key===s.timing);return win&&isMissedWindow(s.timing)&&!suppTaken.has(s.id);});
  const hasLow=suppStack.some(s=>s.low_stock);

  let windowsHTML='';
  SUPP_WINDOWS.forEach(win=>{
    const items=suppStack.filter(s=>s.timing===win.key);
    if(items.length===0)return;
    windowsHTML+=`<div class="supp-window">
      <div class="supp-window-header">
        <span class="supp-window-icon">${win.icon}</span>
        <span class="supp-window-title">${win.title}</span>
        <span class="supp-window-time">${win.time}</span>
      </div>
      ${items.map(s=>{
        const taken=suppTaken.has(s.id);
        const missed=isMissedWindow(s.timing)&&!taken;
        return`<div class="supp-item ${taken?'taken':''} ${missed?'missed':''}" id="sitem_${s.id}">
          <button class="supp-check ${taken?'checked':''}" onclick="suppToggle('${s.id}')">${taken?'✓':''}</button>
          <div class="supp-body">
            <div class="supp-name">${s.name}</div>
            <div class="supp-meta">${s.dose||''}${s.note?' · '+s.note:''}</div>
          </div>
          <button class="supp-low-btn ${s.low_stock?'is-low':''}" onclick="suppToggleLow('${s.id}')">${s.low_stock?'⚠ low':'stock'}</button>
          <button class="supp-del" onclick="suppDelete('${s.id}')">×</button>
        </div>`;
      }).join('')}
    </div>`;
  });

  document.getElementById('suppContent').innerHTML=`
    <div class="supp-ticker ${hasMissed?'status-missed':hasLow?'status-low':''}" id="suppTicker">
      <span id="suppTickerMsg">${hasMissed?'Some supplements missed — check below':hasLow?'Low stock on some items':'All caught up — keep it rolling'}</span>
      <span class="supp-progress">${done}/${total}</span>
    </div>
    <div class="supp-add-form">
      <div class="supp-add-title">Add Supplement</div>
      <div style="position:relative">
        <input class="supp-input" id="suppAddName" placeholder="Search supplement..." oninput="suppSearch(this.value)" autocomplete="off">
        <div class="supp-search-results" id="suppSearchResults"></div>
      </div>
      <div class="supp-add-row" style="margin-top:8px">
        <input class="supp-input" id="suppAddDose" placeholder="Dose (e.g. 5g)">
        <select class="supp-select" id="suppAddTiming">
          ${SUPP_WINDOWS.map(w=>`<option value="${w.key}">${w.icon} ${w.title}</option>`).join('')}
        </select>
      </div>
      <button class="supp-add-btn" onclick="suppAdd()">+ Add to Stack</button>
    </div>
    ${windowsHTML||'<div class="no-data">No supplements added yet.</div>'}
  `;
}

function isMissedWindow(timing){
  const h=new Date().getHours();
  if(timing==='morning')return h>=11;
  if(timing==='preworkout')return h>=15;
  if(timing==='postworkout')return h>=16;
  if(timing==='evening')return h>=23;
  return false;
}

function suppSearch(q){
  const res=document.getElementById('suppSearchResults');
  if(!q.trim()){res.classList.remove('show');res.innerHTML='';return;}
  const matches=SUPP_DB.filter(s=>s.name.toLowerCase().includes(q.toLowerCase())).slice(0,5);
  if(matches.length===0){res.classList.remove('show');return;}
  res.classList.add('show');
  res.innerHTML=matches.map(s=>`<div class="supp-result" onclick="suppPickResult('${s.name}','${s.dose}','${s.timing}')">
    <div class="supp-result-icon">${s.icon||'💊'}</div>
    <div><div class="supp-result-name">${s.name}</div><div class="supp-result-meta">${s.dose} · ${s.timing} · ${s.note}</div></div>
  </div>`).join('');
}

function suppPickResult(name,dose,timing){
  document.getElementById('suppAddName').value=name;
  document.getElementById('suppAddDose').value=dose;
  document.getElementById('suppAddTiming').value=timing;
  document.getElementById('suppSearchResults').classList.remove('show');
}

async function suppAdd(){
  const name=document.getElementById('suppAddName').value.trim();
  const dose=document.getElementById('suppAddDose').value.trim();
  const timing=document.getElementById('suppAddTiming').value;
  if(!name){showToast('Enter a supplement name','var(--orange)');return;}
  const id=Date.now().toString();
  const item={id,name,dose,timing,note:'',low_stock:false,sort_order:suppStack.length};
  suppStack.push(item);
  await supa.from('supplement_stack').insert(item);
  document.getElementById('suppAddName').value='';
  document.getElementById('suppAddDose').value='';
  showToast(`${name} added to stack`);
  renderSupplements();
  if(currentTab==='dashboard')renderDashboard();
}

async function suppToggle(id){
  await toggleSuppTaken(id);
  renderSupplements();
  if(currentTab==='dashboard')renderDashboard();
}

async function suppToggleLow(id){
  const item=suppStack.find(s=>s.id===id);
  if(!item)return;
  item.low_stock=!item.low_stock;
  await supa.from('supplement_stack').update({low_stock:item.low_stock}).eq('id',id);
  renderSupplements();
}

async function suppDelete(id){
  suppStack=suppStack.filter(s=>s.id!==id);
  await supa.from('supplement_stack').delete().eq('id',id);
  showToast('Removed from stack');
  renderSupplements();
  if(currentTab==='dashboard')renderDashboard();
}

// ============================================================
// SLEEP
// ============================================================
function calcSleepScore(log){
  const dur=log.total_sleep;
  const d=log.deep_pct,r=log.rem_pct,w=log.wake_pct;
  const durS=dur>=480?100:dur>=420?90:dur>=360?75:dur>=300?60:45;
  const deepS=d>=35?100:d>=25?90:d>=18?75:d>=12?60:45;
  const remS=r>=22?100:r>=18?88:r>=13?72:r>=9?58:40;
  const effS=w<=1?100:w<=3?88:w<=6?72:55;
  const rhrS=log.rhr?(log.rhr<=50?100:log.rhr<=55?88:log.rhr<=60?75:60):75;
  return Math.round(durS*.3+deepS*.25+remS*.2+effS*.15+rhrS*.1);
}

function sleepScoreColor(s){return s>=80?'var(--green)':s>=65?'var(--accent)':'var(--red)';}

function renderSleepTab(){
  const navHTML=`<div class="sleep-nav">
    <button class="sleep-nav-btn ${sleepView==='dashboard'?'active':''}" onclick="setSleepView('dashboard')">Dashboard</button>
    <button class="sleep-nav-btn ${sleepView==='history'?'active':''}" onclick="setSleepView('history')">History</button>
    <button class="sleep-nav-btn ${sleepView==='trend'?'active':''}" onclick="setSleepView('trend')">Trend</button>
    <button class="sleep-nav-btn" onclick="setSleepView('add')" style="margin-left:auto;background:var(--accent);color:var(--bg);border-color:var(--accent)">+ Log Night</button>
  </div>`;
  document.getElementById('sleepContent').innerHTML=navHTML+'<div id="sleepInner"></div>';
  renderSleepInner();
}

function setSleepView(v){sleepView=v;renderSleepTab();}

function renderSleepInner(){
  const el=document.getElementById('sleepInner');
  if(!el)return;
  if(sleepView==='dashboard')el.innerHTML=renderSleepDashboard();
  else if(sleepView==='history')el.innerHTML=renderSleepHistory();
  else if(sleepView==='trend')el.innerHTML=renderSleepTrend();
  else if(sleepView==='add')el.innerHTML=renderSleepAdd();
  else if(sleepView==='detail')el.innerHTML=renderSleepDetail(sleepDetailId);
}

function renderSleepDashboard(){
  const log=sleepLogs[0];
  if(!log)return`<div class="no-data">No sleep logs yet.<br>Tap + Log Night to start.</div>`;
  const score=calcSleepScore(log);
  return`
    <div class="sleep-score-hero">
      <div class="sleep-score-ring">
        <div class="sleep-score-num" style="color:${sleepScoreColor(score)}">${score}</div>
        <div class="sleep-score-label">Sleep Score</div>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-top:6px">${log.date} · ${log.bedtime||''}→${log.waketime||''}</div>
    </div>
    <div class="card">
      <div class="card-title">Sleep Stages</div>
      <div class="sleep-bars">
        ${sleepBar('Deep',log.deep_pct,'var(--green)',35)}
        ${sleepBar('REM',log.rem_pct,'var(--blue)',22)}
        ${sleepBar('Light',log.light_pct,'var(--purple)',50)}
        ${sleepBar('Wake',log.wake_pct,'var(--red)',5)}
      </div>
      <div class="sleep-vitals">
        <div class="sleep-vital"><div class="sleep-vital-val">${fmtMins(log.total_sleep)}</div><div class="sleep-vital-lbl">Duration</div></div>
        <div class="sleep-vital"><div class="sleep-vital-val" style="color:var(--blue)">${log.rhr||'—'}</div><div class="sleep-vital-lbl">RHR</div></div>
        <div class="sleep-vital"><div class="sleep-vital-val" style="color:var(--green)">${log.spo2||'—'}${log.spo2?'%':''}</div><div class="sleep-vital-lbl">SpO2</div></div>
        <div class="sleep-vital"><div class="sleep-vital-val" style="color:var(--orange)">${log.stress||'—'}</div><div class="sleep-vital-lbl">Stress</div></div>
      </div>
    </div>
    ${log.notes?`<div class="card" style="border-left:2px solid var(--accent)"><div class="card-title">Notes</div><div style="font-size:13px;color:var(--text2)">${log.notes}</div></div>`:''}
  `;
}

function sleepBar(label,pct,color,target){
  const w=Math.min(100,pct||0);
  return`<div class="sleep-bar-row">
    <div class="sleep-bar-top"><span>${label} <strong>${pct||0}%</strong></span><span style="color:var(--text3)">target >${target}%</span></div>
    <div class="sleep-bar-track"><div class="sleep-bar-fill" style="width:${w}%;background:${color}"></div></div>
  </div>`;
}

function renderSleepHistory(){
  if(sleepLogs.length===0)return`<div class="no-data">No entries yet.</div>`;
  return sleepLogs.map(log=>{
    const score=calcSleepScore(log);
    return`<div class="sleep-log-row" onclick="showSleepDetail('${log.id}')">
      <div><div class="sleep-log-date">${log.date}</div><div class="sleep-log-sub">${fmtMins(log.total_sleep)} · Deep ${log.deep_pct}% · REM ${log.rem_pct}%</div></div>
      <div style="text-align:right"><div class="sleep-log-score" style="color:${sleepScoreColor(score)}">${score}</div><div style="font-size:10px;color:var(--text3)">score</div></div>
    </div>`;
  }).join('');
}

function renderSleepTrend(){
  if(sleepLogs.length<2)return`<div class="no-data">Need at least 2 entries for trends.</div>`;
  const sorted=[...sleepLogs].sort((a,b)=>a.date.localeCompare(b.date));
  const scores=sorted.map(l=>calcSleepScore(l));
  const W=320,H=100,pad=10;
  const min=Math.min(...scores)-5,max=Math.max(...scores)+5;
  const pts=sorted.map((l,i)=>{
    const x=pad+(i/(sorted.length-1))*(W-pad*2);
    const y=H-pad-((scores[i]-min)/(max-min))*(H-pad*2);
    return`${i===0?'M':'L'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const area=pts+` L${(pad+(sorted.length-1)/(sorted.length-1)*(W-pad*2)).toFixed(1)},${H-pad} L${pad},${H-pad} Z`;
  const dots=sorted.map((l,i)=>{
    const x=pad+(i/(sorted.length-1))*(W-pad*2);
    const y=H-pad-((scores[i]-min)/(max-min))*(H-pad*2);
    return`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${sleepScoreColor(scores[i])}"/>`;
  }).join('');
  const avgScore=Math.round(scores.reduce((a,s)=>a+s,0)/scores.length);
  const avgDeep=Math.round(sorted.reduce((a,l)=>a+(l.deep_pct||0),0)/sorted.length);
  const avgRem=Math.round(sorted.reduce((a,l)=>a+(l.rem_pct||0),0)/sorted.length);
  return`
    <div class="card">
      <div class="card-title">Score Trend</div>
      <svg class="sleep-trend-svg" viewBox="0 0 ${W} ${H+14}">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8c547" stop-opacity=".3"/><stop offset="100%" stop-color="#e8c547" stop-opacity="0"/></linearGradient></defs>
        <path d="${area}" fill="url(#sg)"/>
        <path d="${pts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      </svg>
    </div>
    <div class="card">
      <div class="card-title">Averages</div>
      <div class="sleep-vitals">
        <div class="sleep-vital"><div class="sleep-vital-val" style="color:var(--accent)">${avgScore}</div><div class="sleep-vital-lbl">Avg Score</div></div>
        <div class="sleep-vital"><div class="sleep-vital-val" style="color:var(--green)">${avgDeep}%</div><div class="sleep-vital-lbl">Avg Deep</div></div>
        <div class="sleep-vital"><div class="sleep-vital-val" style="color:var(--blue)">${avgRem}%</div><div class="sleep-vital-lbl">Avg REM</div></div>
        <div class="sleep-vital"><div class="sleep-vital-val">${fmtMins(Math.round(sorted.reduce((a,l)=>a+(l.total_sleep||0),0)/sorted.length))}</div><div class="sleep-vital-lbl">Avg Duration</div></div>
      </div>
    </div>
  `;
}

function renderSleepDetail(id){
  const log=sleepLogs.find(l=>l.id===id);
  if(!log)return'';
  const score=calcSleepScore(log);
  return`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text)">${log.date}</div>
      <button class="sleep-back-btn" onclick="setSleepView('history')">← Back</button>
    </div>
    <div class="card">
      <div style="text-align:center;padding:8px 0">
        <div class="sleep-score-num" style="color:${sleepScoreColor(score)}">${score}</div>
        <div style="font-size:11px;color:var(--text3);font-family:var(--font-display);letter-spacing:.1em;text-transform:uppercase">Sleep Score</div>
      </div>
      <div class="sleep-bars" style="margin-top:14px">
        ${sleepBar('Deep',log.deep_pct,'var(--green)',35)}
        ${sleepBar('REM',log.rem_pct,'var(--blue)',22)}
        ${sleepBar('Light',log.light_pct,'var(--purple)',50)}
        ${sleepBar('Wake',log.wake_pct,'var(--red)',5)}
      </div>
    </div>
    <div class="card">
      <div class="sleep-detail-grid">
        <div class="sleep-detail-cell"><div class="sleep-detail-label">Total Sleep</div><div class="sleep-detail-val">${fmtMins(log.total_sleep)}</div></div>
        <div class="sleep-detail-cell"><div class="sleep-detail-label">Bedtime</div><div class="sleep-detail-val">${log.bedtime||'—'}→${log.waketime||'—'}</div></div>
        <div class="sleep-detail-cell"><div class="sleep-detail-label">Deep</div><div class="sleep-detail-val">${fmtMins(log.deep)} (${log.deep_pct}%)</div></div>
        <div class="sleep-detail-cell"><div class="sleep-detail-label">REM</div><div class="sleep-detail-val">${fmtMins(log.rem)} (${log.rem_pct}%)</div></div>
        <div class="sleep-detail-cell"><div class="sleep-detail-label">RHR</div><div class="sleep-detail-val">${log.rhr?log.rhr+' bpm':'—'}</div></div>
        <div class="sleep-detail-cell"><div class="sleep-detail-label">SpO2</div><div class="sleep-detail-val">${log.spo2?log.spo2+'%':'—'}</div></div>
        <div class="sleep-detail-cell"><div class="sleep-detail-label">Avg HR</div><div class="sleep-detail-val">${log.avg_hr?log.avg_hr+' bpm':'—'}</div></div>
        <div class="sleep-detail-cell"><div class="sleep-detail-label">Stress</div><div class="sleep-detail-val">${log.stress||'—'}</div></div>
      </div>
    </div>
    ${log.notes?`<div class="card" style="border-left:2px solid var(--accent)"><div class="card-title">Notes</div><div style="font-size:13px;color:var(--text2)">${log.notes}</div></div>`:''}
    <button class="btn-danger" onclick="deleteSleepLog('${log.id}')">Delete Entry</button>
  `;
}

  const t=new Date().toISOString().slice(0,10);
  return`

      <div style="font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text)">Log New Night</div>

    </div>
    <div class="card sleep-form">
      <div class="field"><label>Date</label><input type="date" id="sf-date" value="${t}"></div>
      <div class="sleep-two-col">
        <div class="field"><label>Bedtime</label><input type="time" id="sf-bedtime"></div>
        <div class="field"><label>Wake Time</label><input type="time" id="sf-waketime"></div>
      </div>
      <div class="field"><label>Total Sleep (minutes)</label><input type="number" id="sf-total" placeholder="e.g. 471"></div>
      <div class="sleep-section-sub">Sleep Stages</div>
      <div class="sleep-four-col">
        <div class="field"><label>Deep (min)</label><input type="number" id="sf-deep"></div>
        <div class="field"><label>Deep %</label><input type="number" id="sf-deepPct"></div>
        <div class="field"><label>Light (min)</label><input type="number" id="sf-light"></div>
        <div class="field"><label>Light %</label><input type="number" id="sf-lightPct"></div>
        <div class="field"><label>REM (min)</label><input type="number" id="sf-rem"></div>
        <div class="field"><label>REM %</label><input type="number" id="sf-remPct"></div>
        <div class="field"><label>Wake (min)</label><input type="number" id="sf-wake"></div>
        <div class="field"><label>Wake %</label><input type="number" id="sf-wakePct"></div>
      </div>
      <div class="sleep-section-sub">Vitals</div>

        <div class="field"><label>RHR (bpm)</label><input type="number" id="sf-rhr"></div>
        <div class="field"><label>Avg HR</label><input type="number" id="sf-avgHr"></div>
        <div class="field"><label>SpO2 %</label><input type="number" id="sf-spo2"></div>
        <div class="field"><label>Stress</label><input type="number" id="sf-stress"></div>
      </div>
      <div class="field"><label>Notes (optional)</label><input type="text" id="sf-notes" placeholder="e.g. hard training day, late meal..."></div>
      <button class="btn-primary" onclick="saveSleepLog()">Save Night</button>
    </div>
  `;

function showSleepDetail(id){sleepDetailId=id;sleepView='detail';renderSleepTab();}

async function saveSleepLog(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const n=id=>{const v=g(id);return v?Number(v):null;};
  const log={
    id:Date.now().toString(),date:g('sf-date'),
    bedtime:g('sf-bedtime'),waketime:g('sf-waketime'),
    total_sleep:n('sf-total')||0,
    deep:n('sf-deep')||0,deep_pct:n('sf-deepPct')||0,
    light:n('sf-light')||0,light_pct:n('sf-lightPct')||0,
    rem:n('sf-rem')||0,rem_pct:n('sf-remPct')||0,
    wake:n('sf-wake')||0,wake_pct:n('sf-wakePct')||0,
    rhr:n('sf-rhr'),avg_hr:n('sf-avgHr'),spo2:n('sf-spo2'),stress:n('sf-stress'),
    notes:g('sf-notes')
  };
  if(!log.date||!log.total_sleep){showToast('Fill in Date and Total Sleep at minimum','var(--orange)');return;}
  setSaveStatus('saving','saving...');
  const{error}=await supa.from('sleep_logs').upsert(log,{onConflict:'date'});
  if(error){showToast('Save failed','var(--red)');console.error(error);return;}
  sleepLogs=[log,...sleepLogs.filter(l=>l.date!==log.date)].sort((a,b)=>b.date.localeCompare(a.date));
  setSaveStatus('saved','saved');
  showToast('Sleep logged!');
  sleepView='dashboard';
  renderSleepTab();
  if(currentTab==='dashboard')renderDashboard();
}

async function deleteSleepLog(id){
  if(!confirm('Delete this sleep entry?'))return;
  await supa.from('sleep_logs').delete().eq('id',id);
  sleepLogs=sleepLogs.filter(l=>l.id!==id);
  sleepView='history';
  renderSleepTab();
  if(currentTab==='dashboard')renderDashboard();
}

// ============================================================
// INIT
// ============================================================
async function init(){
  const screen=document.getElementById('loadingScreen');
  const msg=document.getElementById('loadingMsg');
  try{
    msg.textContent='LOADING YOUR DATA...';
    await loadAll();
    msg.textContent='READY';
    setTimeout(()=>screen.classList.add('hidden'),350);
  }catch(e){
    msg.textContent='CONNECTION FAILED';
    msg.style.color='var(--red)';
    console.error(e);
    setTimeout(()=>screen.classList.add('hidden'),2000);
  }
  renderDashboard();
}
init();
</script>
