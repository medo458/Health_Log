<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>IRON LOG</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0d0d0f;--bg2:#141416;--bg3:#1a1a1e;--border:#2a2a2e;--border2:#333338;--text:#f0ede8;--text2:#9a9793;--text3:#5a5755;--accent:#e8c547;--accent2:#c4a030;--green:#3dd68c;--red:#e85454;--orange:#f0923a;--blue:#5b9ef0;--purple:#a78bfa;--card-r:12px;--nav-h:60px;--font-display:'Barlow Condensed',sans-serif;--font-body:'Barlow',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;overflow-x:hidden}
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .4s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{font-family:var(--font-display);font-size:44px;font-weight:900;color:var(--accent);letter-spacing:.15em}
.loading-logo span{color:var(--text3);font-weight:400}
.loading-msg{font-family:var(--font-display);font-size:13px;color:var(--text3);letter-spacing:.12em}
.loading-bar{width:180px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.loading-fill{height:100%;background:var(--accent);border-radius:2px;animation:loadpulse 1.2s ease-in-out infinite}
@keyframes loadpulse{0%{width:0%}50%{width:80%}100%{width:100%}}
.app{display:flex;flex-direction:column;min-height:100vh}
.page{display:none;flex:1;overflow-y:auto;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px)}
.page.active{display:block}
.page-iframe{display:none}
.page-iframe.active{display:block}
.page-iframe iframe{width:100%;height:calc(100vh - 52px - var(--nav-h) - env(safe-area-inset-bottom));border:none;display:block}
.inner{max-width:860px;margin:0 auto;padding:14px}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-logo{font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--accent);letter-spacing:.12em}
.topbar-logo span{color:var(--text3);font-weight:400;font-size:16px}
.save-status{font-family:var(--font-display);font-size:11px;letter-spacing:.06em;color:var(--text3);display:flex;align-items:center;gap:4px}
.save-status .dot{width:6px;height:6px;border-radius:50%;background:var(--text3);transition:background .3s}
.save-status.saved .dot{background:var(--green)}.save-status.saving .dot{background:var(--accent)}.save-status.error .dot{background:var(--red)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:flex-start;padding-top:8px;padding-bottom:env(safe-area-inset-bottom);z-index:200}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 0;border:none;background:transparent;transition:all .15s}
.nav-icon{font-size:22px;line-height:1;transition:transform .15s}
.nav-label{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);transition:color .15s}
.nav-item.active .nav-label{color:var(--accent)}.nav-item.active .nav-icon{transform:scale(1.1)}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:14px;margin-bottom:10px}
.card-title{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;border-left:2px solid var(--accent);padding-left:8px}
.dash-greeting{font-family:var(--font-display);font-size:26px;font-weight:900;color:var(--text);letter-spacing:.04em;margin-bottom:2px}
.dash-date{font-size:12px;color:var(--text3);margin-bottom:14px;font-family:var(--font-display);letter-spacing:.08em}
.dash-phase{border-radius:var(--card-r);padding:14px 16px;margin-bottom:10px;border:1px solid;cursor:pointer;transition:opacity .15s}
.dash-phase:hover{opacity:.85}
.dash-phase.accumulation{background:rgba(91,158,240,.08);border-color:rgba(91,158,240,.3)}.dash-phase.intensification{background:rgba(232,197,71,.08);border-color:rgba(232,197,71,.3)}.dash-phase.peak{background:rgba(232,84,84,.08);border-color:rgba(232,84,84,.3)}.dash-phase.deload{background:rgba(61,214,140,.08);border-color:rgba(61,214,140,.3)}
.dash-phase-top{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.dash-phase-icon{font-size:22px}.dash-phase-name{font-family:var(--font-display);font-size:19px;font-weight:900;letter-spacing:.08em}
.dash-phase.accumulation .dash-phase-name{color:var(--blue)}.dash-phase.intensification .dash-phase-name{color:var(--accent)}.dash-phase.peak .dash-phase-name{color:var(--red)}.dash-phase.deload .dash-phase-name{color:var(--green)}
.dash-phase-desc{font-size:12px;color:var(--text2)}.dash-phase-today{font-family:var(--font-display);font-size:12px;color:var(--text3);margin-top:6px}.dash-phase-today strong{color:var(--text)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dash-widget{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:12px;cursor:pointer;transition:border-color .15s}
.dash-widget:hover{border-color:var(--border2)}
.dw-label{font-family:var(--font-display);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text3);margin-bottom:5px}
.dw-val{font-family:var(--font-display);font-size:30px;font-weight:900;color:var(--text);line-height:1}
.dw-sub{font-size:11px;color:var(--text3);margin-top:2px}
.dw-bar{height:4px;background:var(--bg3);border-radius:2px;margin-top:8px;overflow:hidden}
.dw-bar-fill{height:100%;border-radius:2px;transition:width .4s}
.dash-water-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.dash-water-btn{flex:1;padding:9px;background:var(--accent);color:var(--bg);border:none;border-radius:7px;font-family:var(--font-display);font-size:14px;font-weight:800;cursor:pointer;transition:opacity .15s}
.dash-water-btn:hover{opacity:.85}
.dash-water-minus{width:36px;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--text2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dash-supp-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border)}
.dash-supp-row:last-child{border-bottom:none}
.dash-supp-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:all .2s;flex-shrink:0}
.dash-supp-check.checked{background:var(--green);border-color:var(--green);color:white}
.phase-banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--card-r);border:1px solid;margin-bottom:12px}
.phase-banner.accumulation{background:rgba(91,158,240,.08);border-color:rgba(91,158,240,.3)}.phase-banner.intensification{background:rgba(232,197,71,.08);border-color:rgba(232,197,71,.3)}.phase-banner.peak{background:rgba(232,84,84,.08);border-color:rgba(232,84,84,.3)}.phase-banner.deload{background:rgba(61,214,140,.08);border-color:rgba(61,214,140,.3)}
.phase-icon{font-size:24px}.phase-info{flex:1}
.phase-name{font-family:var(--font-display);font-size:19px;font-weight:900;letter-spacing:.08em;line-height:1}
.phase-banner.accumulation .phase-name{color:var(--blue)}.phase-banner.intensification .phase-name{color:var(--accent)}.phase-banner.peak .phase-name{color:var(--red)}.phase-banner.deload .phase-name{color:var(--green)}
.phase-desc{font-size:11px;color:var(--text2);margin-top:2px}.phase-week-info{text-align:right}
.phase-week-num{font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--text);line-height:1}
.phase-week-label{font-size:10px;color:var(--text3);font-family:var(--font-display);letter-spacing:.08em}
.wave-dots{display:flex;gap:4px;margin-top:4px;justify-content:flex-end}.wave-dot{width:7px;height:7px;border-radius:50%}
.day-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.day-tab{padding:5px 12px;font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--bg2);border:1px solid var(--border);border-radius:5px;color:var(--text3);cursor:pointer;transition:all .15s}
.day-tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}.day-tab.completed{border-color:var(--green);color:var(--green)}.day-tab.completed.active{background:var(--green);color:var(--bg);border-color:var(--green)}
.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:6px;margin-bottom:12px}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:9px 10px}
.stat-label{font-family:var(--font-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:2px}
.stat-val{font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--text);line-height:1}.stat-sub{font-size:10px;color:var(--text3);margin-top:1px}
.section-block{margin-bottom:12px}
.section-label{font-family:var(--font-display);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:7px;border-left:2px solid var(--accent);padding-left:7px}
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:12px 14px;margin-bottom:7px;transition:border-color .2s}
.ex-card.sig-up{border-color:var(--green)}.ex-card.sig-warn{border-color:var(--orange)}.ex-card.sig-deload{border-color:var(--green)}
.ex-top{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.ex-name{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--text);flex:1}
.badge{font-family:var(--font-display);font-size:10px;font-weight:600;letter-spacing:.06em;padding:2px 6px;border-radius:4px;text-transform:uppercase}
.badge-compound{background:rgba(91,158,240,.15);color:var(--blue);border:1px solid rgba(91,158,240,.25)}
.badge-iso{background:rgba(232,197,71,.1);color:var(--accent2);border:1px solid rgba(232,197,71,.2)}.badge-sets{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.phase-target-box{display:flex;gap:6px;flex-wrap:wrap;padding:7px 9px;border-radius:6px;margin-bottom:9px;border:1px solid var(--border);background:var(--bg3);font-size:11px;color:var(--text2)}.phase-target-box strong{color:var(--text)}
.prev-row{font-size:11px;color:var(--text3);margin-bottom:7px}.prev-row strong{color:var(--text2)}
.rep-bar-wrap{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.rep-range-label{font-size:10px;color:var(--text3);min-width:50px;font-family:var(--font-display)}
.rep-track{flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden}
.rep-fill{height:100%;border-radius:2px;transition:width .4s,background .3s}
.rep-count{font-family:var(--font-display);font-size:13px;font-weight:700;min-width:20px;text-align:right}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:var(--font-display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.field input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-display);font-size:16px;font-weight:600;padding:7px 10px;width:100%;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--accent)}.field input::placeholder{color:var(--text3);font-weight:400}
.signal-box{display:flex;align-items:flex-start;gap:7px;padding:7px 10px;border-radius:6px;font-size:11.5px;line-height:1.4}
.signal-box.sig-up{background:rgba(61,214,140,.1);color:#3dd68c;border:1px solid rgba(61,214,140,.2)}.signal-box.sig-hold{background:rgba(90,87,85,.15);color:var(--text2);border:1px solid var(--border)}.signal-box.sig-warn{background:rgba(240,146,58,.1);color:var(--orange);border:1px solid rgba(240,146,58,.2)}.signal-box.sig-deload{background:rgba(61,214,140,.08);color:var(--green);border:1px solid rgba(61,214,140,.2)}.signal-box.sig-new{background:rgba(91,158,240,.1);color:var(--blue);border:1px solid rgba(91,158,240,.2)}
.hist-toggle{font-size:11px;color:var(--text3);cursor:pointer;margin-top:6px;display:inline-flex;align-items:center;gap:3px;text-decoration:underline}
.hist-box{margin-top:5px;padding:7px 9px;background:var(--bg3);border-radius:6px;border:1px solid var(--border)}
.hist-row{display:grid;grid-template-columns:50px 60px 55px 1fr;font-size:11px;color:var(--text2);padding:3px 0;border-bottom:1px solid var(--border)}.hist-row:last-child{border-bottom:none}.hist-row .wk{color:var(--text3);font-family:var(--font-display)}
.hist-ph{font-size:10px;padding:1px 5px;border-radius:3px;font-family:var(--font-display);font-weight:600}
.ph-acc{background:rgba(91,158,240,.15);color:var(--blue)}.ph-int{background:rgba(232,197,71,.15);color:var(--accent)}.ph-peak{background:rgba(232,84,84,.15);color:var(--red)}.ph-dl{background:rgba(61,214,140,.15);color:var(--green)}
.complete-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-save{flex:1;padding:10px 16px;background:var(--accent);color:var(--bg);border:none;border-radius:8px;font-family:var(--font-display);font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:opacity .15s}
.btn-save:hover{opacity:.85}.btn-save:disabled{opacity:.4;cursor:not-allowed}
.btn-complete{flex:1;padding:10px 16px;background:transparent;color:var(--green);border:1px solid var(--green);border-radius:8px;font-family:var(--font-display);font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-complete:hover{background:rgba(61,214,140,.1)}
.filter-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.filter-btn{padding:4px 10px;font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--bg2);border:1px solid var(--border);border-radius:5px;color:var(--text3);cursor:pointer;transition:all .15s}
.filter-btn.active{background:rgba(232,197,71,.12);border-color:var(--accent);color:var(--accent)}
.graph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.graph-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:12px}
.graph-card-title{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--text);margin-bottom:3px}
.graph-card-meta{font-size:11px;color:var(--text3);margin-bottom:10px;display:flex;gap:10px}
.graph-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.no-data{text-align:center;padding:30px;color:var(--text3);font-size:13px}
.toast{position:fixed;bottom:calc(var(--nav-h) + 10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--green);color:var(--bg);padding:9px 18px;border-radius:20px;font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.06em;z-index:9998;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
@media(max-width:480px){.dash-grid{grid-template-columns:1fr 1fr}.graph-grid{grid-template-columns:1fr}.stats-strip{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">IRON<span>LOG</span></div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div class="loading-msg" id="loadingMsg">CONNECTING...</div>
</div>
<div class="app">
  <div class="topbar">
    <div class="topbar-logo">IRON<span>LOG</span></div>
    <div class="save-status" id="saveStatus"><div class="dot"></div><span id="saveStatusText">ready</span></div>
  </div>
  <div class="page active" id="page-dashboard"><div class="inner" id="dashContent"></div></div>
  <div class="page" id="page-workout"><div class="inner" id="workoutContent"></div></div>
  <div class="page-iframe" id="page-water"><iframe src="water.html" id="iframe-water" title="Water Tracker"></iframe></div>
  <div class="page-iframe" id="page-supplements"><iframe src="supplements.html" id="iframe-supplements" title="Supplement Tracker"></iframe></div>
  <div class="page-iframe" id="page-sleep"><iframe src="sleep.html" id="iframe-sleep" title="Sleep Tracker"></iframe></div>
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('dashboard')" id="nav-dashboard"><span class="nav-icon">⚡</span><span class="nav-label">Dashboard</span></button>
    <button class="nav-item" onclick="switchTab('workout')" id="nav-workout"><span class="nav-icon">🏋️</span><span class="nav-label">Workout</span></button>

    <button class="nav-item" onclick="switchTab('sleep')" id="nav-sleep"><span class="nav-icon">🌙</span><span class="nav-label">Sleep</span></button>
  </nav>
</div>

<script>

const supa=supabase.createClient(SUPA_URL,SUPA_KEY);

const PHASES={1:{key:'accumulation',name:'ACCUMULATION',icon:'📦',desc:'High volume · RPE 8',setMod:+1,repRange:[8,10]},2:{key:'intensification',name:'INTENSIFICATION',icon:'⚡',desc:'Push weight up · RPE 9',setMod:0,repRange:[6,8]},3:{key:'peak',name:'PEAK',icon:'🔥',desc:'Max intensity · RPE 10+',setMod:-1,repRange:[5,7]},4:{key:'deload',name:'DELOAD',icon:'🌊',desc:'60% weight · recover',setMod:-1,repRange:[10,15]}};
function getPhase(w){const pos=((w-1)%4)+1;return{...PHASES[pos],weekInCycle:pos,globalWeek:w};}
function getWaveNum(w){return Math.ceil(w/4);}

const COMPOUND=["Squats","RDLs","T-bar row","Seated close grip row","Seated wide grip row","Iso-lateral high row","Pulldown / pull-up","Shoulder press","Incline DB press","Incline machine","Dips","JM press","Rope pullover"];
const DAYS=[

  {key:"posterior",label:"Posterior",sections:[{title:"posterior chain",ex:[{n:"RDLs",s:2,compound:true}]},{title:"back",ex:[{n:"Pulldown / pull-up",s:2,compound:true},{n:"T-bar row",s:2,compound:true},{n:"Seated close grip row",s:2,compound:true}]},{title:"rear delts / triceps",ex:[{n:"Reverse fly",s:2,compound:false},{n:"Single arm tricep pushdown",s:2,compound:false}]},{title:"accessories",ex:[{n:"Posterior forearms",s:2,compound:false}]}]},
  {key:"upper",label:"Modified Upper",sections:[{title:"shoulders",ex:[{n:"Shoulder press",s:2,compound:true},{n:"Lateral raises",s:2,compound:false}]},{title:"back",ex:[{n:"Seated wide grip row",s:2,compound:true},{n:"Incline machine",s:2,compound:true},{n:"Iso-lateral high row",s:2,compound:true},{n:"Rope pullover",s:2,compound:false}]},{title:"triceps",ex:[{n:"Dips",s:2,compound:true}]}]},
  {key:"lower",label:"Modified Lower",sections:[{title:"quads",ex:[{n:"Squats",s:3,compound:true},{n:"Leg extension",s:2,compound:false}]},{title:"hamstrings",ex:[{n:"Lying leg curl",s:2,compound:false}]},{title:"calves / accessories",ex:[{n:"Standing calf raises",s:2,compound:false},{n:"Adductors",s:2,compound:false}]}]},
  {key:"arms",label:"Arms",sections:[{title:"biceps",ex:[{n:"Seated incline curl",s:2,compound:false},{n:"Behind back cable curl",s:2,compound:false},{n:"Hammer curl",s:2,compound:false}]},{title:"triceps",ex:[{n:"JM press",s:2,compound:true},{n:"Single arm tricep pushdown",s:2,compound:false}]}]}
];
const ALL_EX=DAYS.flatMap(d=>d.sections.flatMap(s=>s.ex.map(e=>({...e,dayKey:d.key,dayLabel:d.label}))));

let currentTab='dashboard',DB={},currentWeek=1,completedDays=new Set(),currentWorkoutDay=0,workoutInputs={},workoutChartFilter='all',workoutCharts={};

// Dashboard reads from localStorage set by iframes
function getDashWaterCount(){try{const s=JSON.parse(localStorage.getItem('po_water_v1')||'{}');const k=new Date().toISOString().slice(0,10);return(s.logs&&s.logs[k])||0;}catch{return 0;}}
function getDashWaterTarget(){try{const s=JSON.parse(localStorage.getItem('po_water_v1')||'{}');const ml=s.bottleMl||500;const p=s.profile||{};const wKg=p.weightKg||75;return Math.ceil((wKg*35+(p.activityHrsPerWeek||0)/7*500)/ml);}catch{return 8;}}
function getDashSuppData(){try{const items=JSON.parse(localStorage.getItem('stack:items')||'[]');const taken=JSON.parse(localStorage.getItem('stack:taken:'+new Date().toISOString().slice(0,10))||'{}');return{items,taken};}catch{return{items:[],taken:{}};}}
function getDashSleepLast(){try{return JSON.parse(localStorage.getItem('ahmed_sleep_v2')||'[]')[0]||null;}catch{return null;}}
function calcSleepScore(l){if(!l)return null;const dur=l.totalSleep,d=l.deepPct,r=l.remPct,w=l.wakePct;const dS=dur>=480?100:dur>=420?90:dur>=360?75:dur>=300?60:45,pS=d>=35?100:d>=25?90:d>=18?75:d>=12?60:45,rS=r>=22?100:r>=18?88:r>=13?72:r>=9?58:40,eS=w<=1?100:w<=3?88:w<=6?72:55,hS=!l.rhr?80:l.rhr<=50?98:l.rhr<=55?90:l.rhr<=62?78:60;return Math.round(dS*.3+pS*.25+rS*.2+eS*.15+hS*.1);}
function fmtMins(m){if(!m)return'—';const h=Math.floor(m/60),mn=m%60;return h>0?h+'h '+mn+'m':mn+'m';}

async function loadAll(){
  const[sessions,state]=await Promise.all([supa.from('sessions').select('*'),supa.from('tracker_state').select('*').eq('id',1).single()]);
  DB={};(sessions.data||[]).forEach(r=>{DB[r.day_key+'||'+r.exercise+'||w'+r.week]={weight:r.weight,reps:r.reps};});
  if(!state.error&&state.data){currentWeek=state.data.current_week||1;completedDays=new Set(state.data.completed_days||[]);}
}

  document.getElementById('nav-'+tab).classList.add('active');

  else if(tab==='workout')renderWorkout();
}

function setSaveStatus(type,text){const el=document.getElementById('saveStatus');const tx=document.getElementById('saveStatusText');el.className='save-status '+type;tx.textContent=text;if(type==='saved')setTimeout(()=>{el.className='save-status';tx.textContent='ready';},2500);}
function showToast(msg,bg){const t=document.getElementById('toast');t.textContent=msg;t.style.background=bg||'var(--green)';t.style.color=bg?'white':'var(--bg)';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

function renderDashboard(){
  const phase=getPhase(currentWeek);
  const nextDay=DAYS.find(d=>!completedDays.has(d.key));
  const wc=getDashWaterCount(),wt=getDashWaterTarget(),wp=Math.min(100,Math.round((wc/wt)*100));
  const{items:si,taken:st}=getDashSuppData();
  const sd=si.filter(s=>st[s.id]).length;
  const sl=getDashSleepLast(),ss=calcSleepScore(sl);
  document.getElementById('dashContent').innerHTML=`
    <div class="dash-greeting">GM, Ahmed 👋</div>
    <div class="dash-date">${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
    <div class="dash-phase ${phase.key}" onclick="switchTab('workout')">
      <div class="dash-phase-top"><div class="dash-phase-icon">${phase.icon}</div><div class="dash-phase-name">${phase.name}</div><div style="margin-left:auto;font-family:var(--font-display);font-size:11px;color:var(--text3)">Wave ${getWaveNum(currentWeek)} · Wk ${currentWeek}</div></div>
      <div class="dash-phase-desc">${phase.desc}</div>
      <div class="dash-phase-today">Today: <strong>${nextDay?nextDay.label+' Day':'All days done 🎉'}</strong> · ${completedDays.size}/5 days done</div>
    </div>
    <div class="dash-grid">
      <div class="dash-widget" onclick="switchTab('water')">
        <div class="dw-label">💧 Water</div>
        <div class="dw-val">${wc}<span style="font-size:15px;color:var(--text3)">/${wt}</span></div>
        <div class="dw-sub">bottles today</div>
        <div class="dw-bar"><div class="dw-bar-fill" style="width:${wp}%;background:var(--blue)"></div></div>
        <div class="dash-water-row">
          <button class="dash-water-minus" onclick="event.stopPropagation();dashWaterAdj(-1)">−</button>
          <button class="dash-water-btn" onclick="event.stopPropagation();dashWaterAdj(1)">+ Bottle</button>
        </div>
      </div>
      <div class="dash-widget" onclick="switchTab('sleep')">
        <div class="dw-label">🌙 Last Night</div>
        ${ss!==null?`<div class="dw-val" style="color:${ss>=80?'var(--green)':ss>=65?'var(--accent)':'var(--red)'}">${ss}</div><div class="dw-sub">sleep score</div><div style="font-size:11px;color:var(--text3);margin-top:5px">${fmtMins(sl.totalSleep)} · Deep ${sl.deepPct||0}% · REM ${sl.remPct||0}%</div>`:`<div class="dw-val" style="color:var(--text3)">—</div><div class="dw-sub">no data yet</div>`}
      </div>
    </div>
    <div class="card" onclick="switchTab('supplements')" style="cursor:pointer">
      <div class="card-title">💊 Supplements — ${sd}/${si.length} taken</div>
      ${si.length===0?'<div style="font-size:12px;color:var(--text3)">Open Supps tab to add your stack.</div>':si.slice(0,4).map(s=>`<div class="dash-supp-row"><span style="font-size:13px;color:var(--text)">${s.name} <span style="font-size:11px;color:var(--text3)">${s.dose||''}</span></span><div class="dash-supp-check ${st[s.id]?'checked':''}" onclick="event.stopPropagation();dashToggleSupp('${s.id}')">${st[s.id]?'✓':''}</div></div>`).join('')}
      ${si.length>4?`<div style="font-size:11px;color:var(--text3);margin-top:7px;text-align:center">+${si.length-4} more — tap to see all</div>`:''}

}

function dashWaterAdj(delta){
  try{
    const raw=localStorage.getItem('po_water_v1');
    if(!raw){showToast('Open Water tab first to initialize','var(--orange)');return;}
    const s=JSON.parse(raw);if(!s.logs)s.logs={};
    const k=new Date().toISOString().slice(0,10);
    const next=Math.max(0,(s.logs[k]||0)+delta);
    if(next===0)delete s.logs[k];else s.logs[k]=next;
    localStorage.setItem('po_water_v1',JSON.stringify(s));
    renderDashboard();
  }catch(e){showToast('Open Water tab first to initialize','var(--orange)');}
}

function dashToggleSupp(id){
  try{
    const k='stack:taken:'+new Date().toISOString().slice(0,10);
    const taken=JSON.parse(localStorage.getItem(k)||'{}');
    if(taken[id])delete taken[id];else taken[id]=Date.now();
    localStorage.setItem(k,JSON.stringify(taken));
    renderDashboard();
  }catch(e){}
}

// ---- WORKOUT ----
function ik(n){return n.replace(/[\s\/\-]+/g,'_');}
function dbGet(w,dk,n){return DB[dk+'||'+n+'||w'+w]||null;}
function dbSet(w,dk,n,d){DB[dk+'||'+n+'||w'+w]=d;}
function getPast(dk,n,limit=10){let arr=[];for(let w=currentWeek-1;w>=1&&arr.length<limit;w--){const d=dbGet(w,dk,n);if(d)arr.push({week:w,phase:getPhase(w),...d});}return arr;}
function getPeakW(dk,n){let p=0;for(let w=1;w<currentWeek;w++){const ph=getPhase(w);if(ph.weekInCycle===3){const d=dbGet(w,dk,n);if(d&&parseFloat(d.weight)>p)p=parseFloat(d.weight);}}return p;}
function getLastW(dk,n){for(let w=currentWeek-1;w>=1;w--){const d=dbGet(w,dk,n);if(d&&d.weight)return parseFloat(d.weight);}return null;}
function getAllData(dk,n){let arr=[];for(let w=1;w<=200;w++){const d=dbGet(w,dk,n);if(d&&d.weight)arr.push({week:w,phase:getPhase(w).key,weight:parseFloat(d.weight)||0,reps:parseInt(d.reps)||0});}return arr;}
function getTarget(ex,dk,phase){
  const[rMin,rMax]=phase.repRange;let sets=ex.s;
  if(ex.compound)sets=Math.max(1,sets+phase.setMod);
  let tw=null;const lw=getLastW(dk,ex.n);
  if(phase.weekInCycle===4){const pk=getPeakW(dk,ex.n);const b=pk>0?pk:(lw||0);tw=b>0?Math.round((b*.6)/2.5)*2.5:null;}
  else if(phase.weekInCycle===1)tw=lw;
  else if(phase.weekInCycle===2)tw=lw?lw+2.5:null;
  else if(phase.weekInCycle===3)tw=lw?lw+5:null;
  return{sets,rMin,rMax,tw};
}
function getSignal(dk,n,ex,inp,phase){
  const t=getTarget(ex,dk,phase);const cr=parseInt(inp?.reps)||0;const past=getPast(dk,n,1);const prev=past[0];
  if(phase.weekInCycle===4){if(cr===0)return{type:'deload',msg:'Deload — target '+(t.tw?t.tw+'kg':'60% of peak')+'. '+t.rMin+'–'+t.rMax+' reps, '+t.sets+' sets.'};return{type:'deload',msg:'Deload week — focus form and recovery.'};}
  if(!prev&&cr===0)return{type:'new',msg:'First session — log your baseline.'};
  if(cr===0)return{type:'hold',msg:phase.name+' — '+t.rMin+'–'+t.rMax+' reps, '+t.sets+' sets.'+(t.tw?' Target: '+t.tw+' kg':'')};
  if(cr>=t.rMax)return{type:'up',msg:cr+' reps — top of range! Add weight next session.'};
  if(cr>=t.rMin)return{type:'hold',msg:cr+' reps — inside range. Build to '+t.rMax+'.'};
  return{type:'warn',msg:cr+' reps — below '+t.rMin+' target.'};
}
function sC(t){return{up:'sig-up',hold:'sig-hold',warn:'sig-warn',deload:'sig-deload',new:'sig-new'}[t]||'sig-hold';}
function sI(t){return{up:'↑',hold:'→',warn:'⚠',deload:'🌊',new:'●'}[t]||'→';}
function phC(k){return{accumulation:'ph-acc',intensification:'ph-int',peak:'ph-peak',deload:'ph-dl'}[k]||'';}
function phL(k){return{accumulation:'ACC',intensification:'INT',peak:'PEAK',deload:'DL'}[k]||k;}
function repBar(n,reps,phase){
  const[rMin,rMax]=phase.repRange;const pct=reps>0?Math.min(100,Math.round((reps/rMax)*100)):0;
  const col=reps>=rMax?'var(--green)':reps>=rMin?'var(--orange)':reps>0?'var(--red)':'var(--border)';
  const cc=reps>=rMax?'var(--green)':reps>=rMin?'var(--orange)':reps>0?'var(--red)':'var(--text3)';
  return'<div class="rep-bar-wrap"><span class="rep-range-label">'+rMin+'–'+rMax+'</span><div class="rep-track"><div class="rep-fill" style="width:'+pct+'%;background:'+col+'"></div></div><span class="rep-count" style="color:'+cc+'">'+(reps>0?reps:'—')+'</span></div>';
}

function renderWorkout(){
  const phase=getPhase(currentWeek);const day=DAYS[currentWorkoutDay];
  const allEx=day.sections.flatMap(s=>s.ex);
  const totalSets=allEx.reduce((a,e)=>{let s=e.s;if(e.compound)s=Math.max(1,s+phase.setMod);return a+s;},0);
  const filled=allEx.filter(e=>workoutInputs[ik(e.n)]?.weight).length;
  const upC=allEx.map(e=>getSignal(day.key,e.n,e,workoutInputs[ik(e.n)],phase).type).filter(t=>t==='up').length;
  const dc=['var(--blue)','var(--accent)','var(--red)','var(--green)'];
  const waveDots=[1,2,3,4].map(i=>{const a=i===phase.weekInCycle;const c=dc[i-1];return'<div class="wave-dot" style="background:'+(i<=phase.weekInCycle?c:'var(--border)')+(a?';box-shadow:0 0 0 2px var(--bg2),0 0 0 3px '+c:'')+'"></div>';}).join('');
  const tabs=DAYS.map((d,i)=>{const done=completedDays.has(d.key);return'<button class="day-tab '+(i===currentWorkoutDay?'active':'')+' '+(done?'completed':'')+'" onclick="switchWorkoutDay('+i+'">'+d.label+(done?' ✓':'')+'</button>';}).join('');
  let exHTML='';
  day.sections.forEach(sec=>{
    exHTML+='<div class="section-block"><div class="section-label">'+sec.title+'</div>';
    sec.ex.forEach(ex=>{
      const key=ik(ex.n);const inp=workoutInputs[key]||{};
      const sig=getSignal(day.key,ex.n,ex,inp,phase);const reps=parseInt(inp.reps)||0;
      const t=getTarget(ex,day.key,phase);const past=getPast(day.key,ex.n,5);const prev=past[0];
      const prevTxt=prev?'Wk'+prev.week+': <strong>'+(prev.weight||'—')+'kg</strong> × <strong>'+(prev.reps||'—')+' reps</strong>':'no previous data';
      const histRows=past.map(h=>'<div class="hist-row"><span class="wk">Wk'+h.week+'</span><span class="hist-ph '+phC(h.phase.key)+'">'+phL(h.phase.key)+'</span><span>'+(h.weight||'—')+'kg</span><span>'+(h.reps||'—')+'r</span></div>').join('');
      exHTML+='<div class="ex-card '+sC(sig.type)+'" id="wcard_'+key+'">'
        +'<div class="ex-top"><span class="ex-name">'+ex.n+'</span><span class="badge '+(ex.compound?'badge-compound':'badge-iso')+'">'+(ex.compound?'cmpd':'iso')+'</span><span class="badge badge-sets">'+t.sets+'s</span></div>'
        +'<div class="phase-target-box">🎯 <strong>'+t.rMin+'–'+t.rMax+' reps</strong> · <strong>'+t.sets+' sets</strong>'+(t.tw?' · <strong>'+t.tw+'kg</strong>':'')+'</div>'
        +'<div class="prev-row">'+prevTxt+'</div>'
        +'<div id="wbar_'+key+'">'+repBar(ex.n,reps,phase)+'</div>'
        +'<div class="input-row"><div class="field"><label>Weight kg</label><input type="number" step="0.5" placeholder="kg" value="'+(inp.weight||'')+'" oninput="wUpd(\''+key+'\',\'weight\',this.value,\''+day.key+'\',\''+ex.n+'\')"></div><div class="field"><label>Reps to failure</label><input type="number" placeholder="'+t.rMin+'–'+t.rMax+'" value="'+(inp.reps||'')+'" oninput="wUpd(\''+key+'\',\'reps\',this.value,\''+day.key+'\',\''+ex.n+'\')"></div></div>'
        +'<div class="signal-box '+sC(sig.type)+'" id="wsig_'+key+'"><span>'+sI(sig.type)+'</span><span>'+sig.msg+'</span></div>'
        +(past.length>0?'<div class="hist-toggle" onclick="toggleHist(\'whb_'+key+'\')">▾ history ('+past.length+')</div><div id="whb_'+key+'" style="display:none" class="hist-box">'+histRows+'</div>':'')
        +'</div>';
    });
    exHTML+='</div>';
  });

  document.getElementById('workoutContent').innerHTML=
    '<div class="phase-banner '+phase.key+'">'
    +'<div class="phase-icon">'+phase.icon+'</div>'
    +'<div class="phase-info"><div class="phase-name">'+phase.name+'</div><div class="phase-desc">'+phase.desc+'</div></div>'
    +'<div class="phase-week-info"><div class="phase-week-num">'+currentWeek+'</div><div class="phase-week-label">Wave '+getWaveNum(currentWeek)+'</div><div class="wave-dots">'+waveDots+'</div></div>'
    +'</div>'
    +'<div class="day-tabs">'+tabs+'</div>'
    +'<div class="stats-strip">'
    +'<div class="stat-card"><div class="stat-label">Sets</div><div class="stat-val">'+totalSets+'</div><div class="stat-sub">today</div></div>'
    +'<div class="stat-card"><div class="stat-label">Logged</div><div class="stat-val">'+filled+'/'+allEx.length+'</div><div class="stat-sub">exs</div></div>'
    +'<div class="stat-card"><div class="stat-label">On target</div><div class="stat-val" style="color:var(--green)">'+upC+'</div><div class="stat-sub">exs</div></div>'
    +'<div class="stat-card"><div class="stat-label">Days done</div><div class="stat-val" style="color:var(--purple)">'+completedDays.size+'/5</div><div class="stat-sub">week</div></div>'
    +'</div>'
    +exHTML
    +'<div class="complete-row">'
    +'<button class="btn-save" id="wSaveBtn" onclick="saveWorkoutSession()">✓ Save</button>'
    +'<button class="btn-complete" onclick="completeWorkoutDay()">✓ Complete Day</button>'
    +'</div>'
    +'<div style="margin-top:16px"><div class="card-title" style="margin-bottom:8px">PROGRESSION GRAPHS</div>'
    +'<div class="filter-row" id="wFilterRow"></div>'
    +'<div class="graph-grid" id="wGraphGrid"></div></div>';

  buildWFilterRow();buildWGraphs();
}

function switchWorkoutDay(i){currentWorkoutDay=i;workoutInputs={};renderWorkout();}
function toggleHist(id){const el=document.getElementById(id);if(el)el.style.display=el.style.display==='none'?'block':'none';}

function wUpd(key,field,val,dk,exName){
  if(!workoutInputs[key])workoutInputs[key]={};workoutInputs[key][field]=val;
  const phase=getPhase(currentWeek);const day=DAYS[currentWorkoutDay];
  const ex=day.sections.flatMap(s=>s.ex).find(e=>ik(e.n)===key);if(!ex)return;
  const inp=workoutInputs[key];const reps=parseInt(inp.reps)||0;
  const sig=getSignal(dk,exName,ex,inp,phase);
  const se=document.getElementById('wsig_'+key);if(se){se.className='signal-box '+sC(sig.type);se.innerHTML='<span>'+sI(sig.type)+'</span><span>'+sig.msg+'</span>';}
  const be=document.getElementById('wbar_'+key);if(be)be.innerHTML=repBar(exName,reps,phase);
  const ce=document.getElementById('wcard_'+key);if(ce)ce.className='ex-card '+sC(sig.type);
}

async function saveWorkoutSession(){
  const day=DAYS[currentWorkoutDay];const toSave=[];
  day.sections.flatMap(s=>s.ex).forEach(ex=>{const key=ik(ex.n);if(workoutInputs[key]?.weight)toSave.push({ex,key,inp:workoutInputs[key]});});
  if(toSave.length===0){showToast('Enter at least one weight first','var(--orange)');return;}
  const btn=document.getElementById('wSaveBtn');btn.disabled=true;setSaveStatus('saving','saving...');
  try{
    await Promise.all(toSave.map(({ex,inp})=>supa.from('sessions').upsert({week:currentWeek,day_key:day.key,exercise:ex.n,weight:parseFloat(inp.weight),reps:parseInt(inp.reps)},{onConflict:'week,day_key,exercise'})));
    toSave.forEach(({ex,inp})=>dbSet(currentWeek,day.key,ex.n,inp));
    workoutInputs={};setSaveStatus('saved','saved');showToast(toSave.length+' exercises saved');renderWorkout();
  }catch(e){setSaveStatus('error','error');showToast('Save failed','var(--red)');console.error(e);}
  btn.disabled=false;
}

async function completeWorkoutDay(){
  const day=DAYS[currentWorkoutDay];completedDays.add(day.key);
  if(completedDays.size>=5){currentWeek++;completedDays=new Set();showToast('Week done! Week '+currentWeek+' — '+getPhase(currentWeek).name+' 🎯');}
  else{const next=DAYS.findIndex((d,i)=>i!==currentWorkoutDay&&!completedDays.has(d.key));if(next!==-1)currentWorkoutDay=next;showToast(day.label+' complete! '+(5-completedDays.size)+' days left.');}
  workoutInputs={};setSaveStatus('saving','saving...');
  await supa.from('tracker_state').upsert({id:1,current_week:currentWeek,completed_days:[...completedDays]},{onConflict:'id'});
  setSaveStatus('saved','saved');renderWorkout();
}

function buildWFilterRow(){
  const filters=[{key:'all',label:'All'},{key:'compound',label:'Compound'},{key:'isolation',label:'Iso'},...DAYS.map(d=>({key:d.key,label:d.label}))];
  const el=document.getElementById('wFilterRow');if(!el)return;
  el.innerHTML=filters.map(f=>'<button class="filter-btn '+(workoutChartFilter===f.key?'active':'')+'" onclick="setWFilter(\''+f.key+'\')">'+f.label+'</button>').join('');
}
function setWFilter(k){workoutChartFilter=k;buildWFilterRow();buildWGraphs();}
function buildWGraphs(){
  Object.values(workoutCharts).forEach(c=>c.destroy());workoutCharts={};
  const grid=document.getElementById('wGraphGrid');if(!grid)return;
  const fe=workoutChartFilter==='all'?ALL_EX:workoutChartFilter==='compound'?ALL_EX.filter(e=>e.compound):workoutChartFilter==='isolation'?ALL_EX.filter(e=>!e.compound):ALL_EX.filter(e=>e.dayKey===workoutChartFilter);
  const wd=fe.filter(e=>getAllData(e.dayKey,e.n).length>0);
  if(wd.length===0){grid.innerHTML='<div class="no-data">Log sessions to see graphs.</div>';return;}
  grid.innerHTML=wd.map(e=>'<div class="graph-card"><div class="graph-card-title">'+e.n+'</div><div class="graph-card-meta"><span><span class="graph-dot" style="background:var(--accent)"></span>kg</span><span><span class="graph-dot" style="background:var(--blue)"></span>reps</span></div><canvas id="gc_'+ik(e.dayKey)+'_'+ik(e.n)+'" height="130"></canvas></div>').join('');
  wd.forEach(e=>{
    const data=getAllData(e.dayKey,e.n);const id='gc_'+ik(e.dayKey)+'_'+ik(e.n);const ctx=document.getElementById(id);if(!ctx)return;
    const ptC=data.map(d=>({accumulation:'var(--blue)',intensification:'var(--accent)',peak:'var(--red)',deload:'var(--green)'}[d.phase]||'var(--accent)'));
    workoutCharts[id]=new Chart(ctx,{type:'line',data:{labels:data.map(d=>'W'+d.week),datasets:[{label:'kg',data:data.map(d=>d.weight),borderColor:'rgba(232,197,71,.9)',backgroundColor:'rgba(232,197,71,.08)',tension:.35,pointRadius:4,pointBackgroundColor:ptC,yAxisID:'y',fill:true},{label:'reps',data:data.map(d=>d.reps),borderColor:'rgba(91,158,240,.8)',backgroundColor:'transparent',tension:.35,pointRadius:3,pointBackgroundColor:'rgba(91,158,240,1)',yAxisID:'y2',borderDash:[4,3]}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1a1e',borderColor:'#2a2a2e',borderWidth:1,titleColor:'#f0ede8',bodyColor:'#9a9793',callbacks:{title:items=>'Week '+data[items[0].dataIndex].week+' — '+phL(data[items[0].dataIndex].phase)}}},scales:{x:{ticks:{color:'#5a5755',font:{family:'Barlow Condensed',size:10}},grid:{color:'rgba(42,42,46,.5)'}},y:{position:'left',ticks:{color:'#e8c547',font:{family:'Barlow Condensed',size:10}},grid:{color:'rgba(42,42,46,.5)'}},y2:{position:'right',ticks:{color:'#5b9ef0',font:{family:'Barlow Condensed',size:10}},grid:{drawOnChartArea:false}}}}});
  });
}

async function init(){
  const screen=document.getElementById('loadingScreen');const msg=document.getElementById('loadingMsg');
  try{msg.textContent='LOADING YOUR DATA...';await loadAll();msg.textContent='READY';setTimeout(()=>screen.classList.add('hidden'),350);}
  catch(e){msg.textContent='CONNECTION FAILED';msg.style.color='var(--red)';console.error(e);setTimeout(()=>screen.classList.add('hidden'),2000);}
  renderDashboard();
}
init();
</script>
</body>
</html>
