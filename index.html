<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRON LOG v2</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#0d0d0f;--bg2:#141416;--bg3:#1a1a1e;
  --border:#2a2a2e;--border2:#333338;
  --text:#f0ede8;--text2:#9a9793;--text3:#5a5755;
  --accent:#e8c547;--accent2:#c4a030;
  --green:#3dd68c;--red:#e85454;--orange:#f0923a;--blue:#5b9ef0;--purple:#a78bfa;
  --card-r:10px;
  --font-display:'Barlow Condensed',sans-serif;
  --font-body:'Barlow',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh}

/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;transition:opacity .4s}
.loading-screen.hidden{opacity:0;pointer-events:none}
.loading-logo{font-family:var(--font-display);font-size:40px;font-weight:900;color:var(--accent);letter-spacing:.15em}
.loading-logo span{color:var(--text3);font-weight:400}
.loading-msg{font-family:var(--font-display);font-size:14px;color:var(--text3);letter-spacing:.1em}
.loading-bar{width:200px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.loading-fill{height:100%;background:var(--accent);border-radius:2px;animation:loadpulse 1.2s ease-in-out infinite}
@keyframes loadpulse{0%{width:0%}50%{width:80%}100%{width:100%}}

/* HEADER */
.header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:56px;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:.12em;color:var(--accent)}
.logo span{color:var(--text3);font-weight:400}
.header-right{display:flex;align-items:center;gap:10px}
.save-status{font-family:var(--font-display);font-size:12px;letter-spacing:.06em;color:var(--text3);display:flex;align-items:center;gap:5px}
.save-status .dot{width:7px;height:7px;border-radius:50%;background:var(--text3);transition:background .3s}
.save-status.saved .dot{background:var(--green)}
.save-status.saving .dot{background:var(--accent)}
.save-status.error .dot{background:var(--red)}
.nav-tabs{display:flex;gap:2px}
.nav-tab{padding:6px 16px;font-family:var(--font-display);font-size:15px;font-weight:600;letter-spacing:.06em;background:transparent;border:none;color:var(--text3);cursor:pointer;border-radius:6px;transition:all .15s}
.nav-tab:hover{color:var(--text2);background:var(--bg3)}
.nav-tab.active{color:var(--accent);background:rgba(232,197,71,.1)}

.main{max-width:900px;margin:0 auto;padding:1.5rem}

/* PHASE BANNER */
.phase-banner{
  display:flex;align-items:center;gap:16px;
  margin-bottom:1.5rem;padding:16px 20px;
  border-radius:var(--card-r);border:1px solid;
}
.phase-banner.accumulation{background:rgba(91,158,240,.08);border-color:rgba(91,158,240,.3)}
.phase-banner.intensification{background:rgba(232,197,71,.08);border-color:rgba(232,197,71,.3)}
.phase-banner.peak{background:rgba(232,84,84,.08);border-color:rgba(232,84,84,.3)}
.phase-banner.deload{background:rgba(61,214,140,.08);border-color:rgba(61,214,140,.3)}
.phase-icon{font-size:28px;line-height:1}
.phase-info{flex:1}
.phase-name{font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:.1em;line-height:1}
.phase-banner.accumulation .phase-name{color:var(--blue)}
.phase-banner.intensification .phase-name{color:var(--accent)}
.phase-banner.peak .phase-name{color:var(--red)}
.phase-banner.deload .phase-name{color:var(--green)}
.phase-desc{font-size:12px;color:var(--text2);margin-top:3px}
.phase-week{font-family:var(--font-display);font-size:13px;letter-spacing:.08em;color:var(--text3);text-align:right}
.phase-week strong{font-size:20px;font-weight:800;display:block;color:var(--text)}
.wave-dots{display:flex;gap:6px;margin-top:6px;justify-content:flex-end}
.wave-dot{width:10px;height:10px;border-radius:50%;background:var(--border)}
.wave-dot.acc{background:var(--blue)}
.wave-dot.int{background:var(--accent)}
.wave-dot.peak{background:var(--red)}
.wave-dot.dl{background:var(--green)}
.wave-dot.active{box-shadow:0 0 0 2px var(--bg2),0 0 0 3px currentColor}

/* DAY TABS */
.day-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.5rem}
.day-tab{padding:7px 18px;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--bg2);border:1px solid var(--border);border-radius:6px;color:var(--text3);cursor:pointer;transition:all .15s}
.day-tab:hover{color:var(--text);border-color:var(--border2)}
.day-tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.day-tab.completed{border-color:var(--green);color:var(--green)}
.day-tab.completed.active{background:var(--green);color:var(--bg);border-color:var(--green)}

/* STATS */
.stats-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:1.5rem}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:12px 14px}
.stat-label{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:4px}
.stat-val{font-family:var(--font-display);font-size:26px;font-weight:800;color:var(--text);line-height:1}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* SECTION */
.section-block{margin-bottom:1.5rem}
.section-label{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:10px;border-left:2px solid var(--accent);padding-left:8px}

/* EXERCISE CARD */
.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:16px 18px;margin-bottom:10px;transition:border-color .2s}
.ex-card.sig-up{border-color:var(--green)}
.ex-card.sig-warn{border-color:var(--orange)}
.ex-card.sig-deload{border-color:var(--green)}
.ex-card.sig-hold{border-color:var(--border)}
.ex-top{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.ex-name{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:.04em;color:var(--text);flex:1}
.badge{font-family:var(--font-display);font-size:11px;font-weight:600;letter-spacing:.08em;padding:2px 8px;border-radius:4px;text-transform:uppercase}
.badge-compound{background:rgba(91,158,240,.15);color:var(--blue);border:1px solid rgba(91,158,240,.25)}
.badge-iso{background:rgba(232,197,71,.1);color:var(--accent2);border:1px solid rgba(232,197,71,.2)}
.badge-sets{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.badge-target{font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid}

/* PHASE TARGETS */
.phase-target-box{
  display:flex;gap:8px;flex-wrap:wrap;
  padding:10px 12px;border-radius:7px;margin-bottom:12px;
  border:1px solid var(--border);background:var(--bg3);
}
.pt-item{font-size:12px;color:var(--text2)}
.pt-item strong{color:var(--text)}
.pt-divider{color:var(--text3);font-size:12px}

.prev-row{font-size:12px;color:var(--text3);margin-bottom:10px}
.prev-row strong{color:var(--text2)}

/* REP BAR */
.rep-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.rep-range-label{font-size:11px;color:var(--text3);min-width:60px;font-family:var(--font-display);letter-spacing:.04em}
.rep-track{flex:1;height:5px;background:var(--bg3);border-radius:3px;overflow:hidden}
.rep-fill{height:100%;border-radius:3px;transition:width .4s,background .3s}
.rep-count{font-family:var(--font-display);font-size:14px;font-weight:700;min-width:24px;text-align:right}

/* INPUTS */
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--font-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
.field input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--font-display);font-size:18px;font-weight:600;padding:8px 12px;width:100%;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--accent)}
.field input::placeholder{color:var(--text3);font-weight:400}

/* SIGNAL */
.signal-box{display:flex;align-items:flex-start;gap:8px;padding:9px 12px;border-radius:7px;font-size:12.5px;line-height:1.4}
.signal-box.sig-up{background:rgba(61,214,140,.1);color:#3dd68c;border:1px solid rgba(61,214,140,.2)}
.signal-box.sig-hold{background:rgba(90,87,85,.15);color:var(--text2);border:1px solid var(--border)}
.signal-box.sig-warn{background:rgba(240,146,58,.1);color:var(--orange);border:1px solid rgba(240,146,58,.2)}
.signal-box.sig-deload{background:rgba(61,214,140,.08);color:var(--green);border:1px solid rgba(61,214,140,.2)}
.signal-box.sig-new{background:rgba(91,158,240,.1);color:var(--blue);border:1px solid rgba(91,158,240,.2)}
.sig-icon{font-size:14px;margin-top:1px;flex-shrink:0}

.hist-toggle{font-size:11px;color:var(--text3);cursor:pointer;margin-top:8px;display:inline-flex;align-items:center;gap:4px;text-decoration:underline}
.hist-toggle:hover{color:var(--text2)}
.hist-box{margin-top:8px;padding:10px 12px;background:var(--bg3);border-radius:7px;border:1px solid var(--border)}
.hist-row{display:grid;grid-template-columns:55px 70px 60px 1fr;font-size:12px;color:var(--text2);padding:4px 0;border-bottom:1px solid var(--border)}
.hist-row:last-child{border-bottom:none}
.hist-row .wk{color:var(--text3);font-family:var(--font-display)}
.hist-row .ph{font-size:10px;padding:1px 5px;border-radius:3px;font-family:var(--font-display);font-weight:600}
.ph-acc{background:rgba(91,158,240,.15);color:var(--blue)}
.ph-int{background:rgba(232,197,71,.15);color:var(--accent)}
.ph-peak{background:rgba(232,84,84,.15);color:var(--red)}
.ph-dl{background:rgba(61,214,140,.15);color:var(--green)}

/* COMPLETE DAY BTN */
.complete-row{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem;gap:12px;flex-wrap:wrap}
.btn-save{padding:10px 28px;background:var(--accent);color:var(--bg);border:none;border-radius:7px;font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:opacity .15s,transform .1s}
.btn-save:hover{opacity:.85}
.btn-save:active{transform:scale(.97)}
.btn-save:disabled{opacity:.4;cursor:not-allowed}
.btn-complete{padding:10px 28px;background:transparent;color:var(--green);border:1px solid var(--green);border-radius:7px;font-family:var(--font-display);font-size:16px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.btn-complete:hover{background:rgba(61,214,140,.1)}
.btn-complete:disabled{opacity:.4;cursor:not-allowed}

/* GRAPHS */
.graphs-header{display:flex;align-items:center;gap:12px;margin-bottom:1.5rem;flex-wrap:wrap}
.graphs-header h2{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:.08em;color:var(--text)}
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1.5rem}
.filter-btn{padding:5px 14px;font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--bg2);border:1px solid var(--border);border-radius:5px;color:var(--text3);cursor:pointer;transition:all .15s}
.filter-btn:hover{color:var(--text)}
.filter-btn.active{background:rgba(232,197,71,.12);border-color:var(--accent);color:var(--accent)}
.graph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:16px}
.graph-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--card-r);padding:16px}
.graph-title{font-family:var(--font-display);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--text);margin-bottom:4px}
.graph-meta{font-size:11px;color:var(--text3);margin-bottom:14px;display:flex;gap:12px;flex-wrap:wrap}
.graph-meta span{display:flex;align-items:center;gap:4px}
.graph-meta .dot{width:6px;height:6px;border-radius:50%;display:inline-block}
canvas{max-width:100%}
.no-data{text-align:center;padding:40px;color:var(--text3);font-size:14px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:var(--bg);padding:10px 20px;border-radius:7px;font-family:var(--font-display);font-size:14px;font-weight:700;letter-spacing:.06em;z-index:999;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:none;max-width:320px;text-align:center}
.toast.show{opacity:1;transform:translateY(0)}

::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

@media(max-width:600px){
  .nav-tab{padding:6px 10px;font-size:13px}
  .graph-grid{grid-template-columns:1fr}
  .header{padding:0 1rem}
  .main{padding:1rem}
  .phase-banner{flex-wrap:wrap}
}
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">IRON<span>LOG</span></div>
  <div class="loading-bar"><div class="loading-fill"></div></div>
  <div class="loading-msg" id="loadingMsg">CONNECTING TO DATABASE...</div>
</div>

<div class="header">
  <div class="logo">IRON<span>LOG</span> <span style="font-size:13px;letter-spacing:.06em">v2</span></div>
  <div class="header-right">
    <div class="save-status" id="saveStatus"><div class="dot"></div><span id="saveStatusText">ready</span></div>
    <div class="nav-tabs">
      <button class="nav-tab active" onclick="showView('log')">Log</button>
      <button class="nav-tab" onclick="showView('graphs')">Graphs</button>
    </div>
  </div>
</div>

<div class="main">
  <div id="view-log">
    <div class="phase-banner" id="phaseBanner">
      <div class="phase-icon" id="phaseIcon"></div>
      <div class="phase-info">
        <div class="phase-name" id="phaseName"></div>
        <div class="phase-desc" id="phaseDesc"></div>
      </div>
      <div class="phase-week">
        <span id="phaseWeekLabel"></span>
        <strong id="phaseWeekNum"></strong>
        <div class="wave-dots" id="waveDots"></div>
      </div>
    </div>

    <div class="day-tabs" id="dayTabs"></div>
    <div class="stats-strip" id="statsStrip"></div>
    <div id="exerciseArea"></div>

    <div class="complete-row">
      <button class="btn-save" id="saveBtn" onclick="saveSession()">&#10003; Save Session</button>
      <button class="btn-complete" id="completeBtn" onclick="completeDay()">&#10003; Complete Day & Advance</button>
    </div>
  </div>

  <div id="view-graphs" style="display:none">
    <div class="graphs-header"><h2>PROGRESSION GRAPHS</h2></div>
    <div class="filter-row" id="graphFilterRow"></div>
    <div class="graph-grid" id="graphGrid"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---- SUPABASE ----
const SUPA_URL = 'https://eubasgfirmupygxzhjeo.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1YmFzZ2Zpcm11cHlneHpoamVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NjcxOTQsImV4cCI6MjA5NDU0MzE5NH0.9Zpf6uCfTsygVFmHZepTHpdb9GPa6-GWSgIJHd_E52w';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// ---- WAVE PERIODIZATION ----
// Phase repeats every 4 weeks: 1=Accumulation, 2=Intensification, 3=Peak, 4=Deload
const PHASES = {
  1: {
    key:'accumulation', name:'ACCUMULATION', icon:'📦',
    desc:'High volume — add 1 set to compounds. Moderate intensity. RPE 8.',
    setMod: +1,   // +1 set vs base on compounds
    weightMod: 0, // use last wave's weight
    repRange: [8,10],
    color:'var(--blue)'
  },
  2: {
    key:'intensification', name:'INTENSIFICATION', icon:'⚡',
    desc:'Normal sets, push weight up. Progressive overload week. RPE 9.',
    setMod: 0,
    weightMod: +2.5,
    repRange: [6,8],
    color:'var(--accent)'
  },
  3: {
    key:'peak', name:'PEAK', icon:'🔥',
    desc:'Drop volume, hit absolute heaviest. Low sets, max intensity. RPE 10+.',
    setMod: -1,   // -1 set vs base on compounds
    weightMod: +5,
    repRange: [5,7],
    color:'var(--red)'
  },
  4: {
    key:'deload', name:'DELOAD', icon:'🌊',
    desc:'Mandatory recovery. 60% of peak weight, half sets. Let adaptations consolidate.',
    setMod: -1,
    weightMod: -999, // signal to use 60% of peak
    repRange: [10,15],
    color:'var(--green)'
  }
};

function getPhase(week) {
  const pos = ((week - 1) % 4) + 1;
  return { ...PHASES[pos], weekInCycle: pos, globalWeek: week };
}

function getWaveNumber(week) { return Math.ceil(week / 4); }

// ---- PROGRAM ----
const COMPOUND = ["Squats","RDLs","T-bar row","Seated close grip row","Seated wide grip row","Iso-lateral high row","Pulldown / pull-up","Shoulder press","Incline DB press","Incline machine","Dips","JM press","Rope pullover"];

const DAYS = [
  {key:"anterior", label:"Anterior", sections:[
    {title:"chest / anterior", ex:[
      {n:"Incline DB press", s:2, compound:true},
      {n:"Chest fly", s:3, compound:false},
      {n:"Low-to-High Cable fly", s:3, compound:false}
    ]},
    {title:"biceps", ex:[{n:"Preacher curl",s:2,compound:false}]},
    {title:"legs / accessories", ex:[
      {n:"Leg extension",s:2,compound:false},
      {n:"Anterior forearms",s:2,compound:false}
    ]}
  ]},
  {key:"posterior", label:"Posterior", sections:[
    {title:"posterior chain", ex:[{n:"RDLs",s:2,compound:true}]},
    {title:"back", ex:[
      {n:"Pulldown / pull-up",s:2,compound:true},
      {n:"T-bar row",s:2,compound:true},
      {n:"Seated close grip row",s:2,compound:true}
    ]},
    {title:"rear delts / triceps", ex:[
      {n:"Reverse fly",s:2,compound:false},
      {n:"Single arm tricep pushdown",s:2,compound:false}
    ]},
    {title:"accessories", ex:[{n:"Posterior forearms",s:2,compound:false}]}
  ]},
  {key:"upper", label:"Modified Upper", sections:[
    {title:"shoulders", ex:[
      {n:"Shoulder press",s:2,compound:true},
      {n:"Lateral raises",s:2,compound:false}
    ]},
    {title:"back", ex:[
      {n:"Seated wide grip row",s:2,compound:true},
      {n:"Incline machine",s:2,compound:true},
      {n:"Iso-lateral high row",s:2,compound:true},
      {n:"Rope pullover",s:2,compound:false}
    ]},
    {title:"triceps", ex:[{n:"Dips",s:2,compound:true}]}
  ]},
  {key:"lower", label:"Modified Lower", sections:[
    {title:"quads", ex:[
      {n:"Squats",s:3,compound:true},
      {n:"Leg extension",s:2,compound:false}
    ]},
    {title:"hamstrings", ex:[{n:"Lying leg curl",s:2,compound:false}]},
    {title:"calves / accessories", ex:[
      {n:"Standing calf raises",s:2,compound:false},
      {n:"Adductors",s:2,compound:false}
    ]}
  ]},
  {key:"arms", label:"Arms", sections:[
    {title:"biceps", ex:[
      {n:"Seated incline curl",s:2,compound:false},
      {n:"Behind back cable curl",s:2,compound:false},
      {n:"Hammer curl",s:2,compound:false}
    ]},
    {title:"triceps", ex:[
      {n:"JM press",s:2,compound:true},
      {n:"Single arm tricep pushdown",s:2,compound:false}
    ]}
  ]}
];

const ALL_EX = DAYS.flatMap(d=>d.sections.flatMap(s=>s.ex.map(e=>({...e,dayKey:d.key,dayLabel:d.label}))));

// ---- STATE ----
let currentDay = 0;
let currentWeek = 1;
let inputs = {};
let charts = {};
let graphFilter = 'all';
let DB = {};         // sessions cache
let completedDays = new Set(); // days completed this week

// ---- SUPABASE OPS ----
async function loadAllData() {
  // Load sessions
  const {data:sessions, error:e1} = await supa.from('sessions').select('*');
  if (e1) throw e1;
  DB = {};
  (sessions||[]).forEach(row => {
    DB[`${row.day_key}||${row.exercise}||w${row.week}`] = {weight:row.weight, reps:row.reps};
  });

  // Load tracker state (current week + completed days)
  const {data:state, error:e2} = await supa.from('tracker_state').select('*').eq('id', 1).single();
  if (!e2 && state) {
    currentWeek = state.current_week || 1;
    completedDays = new Set(state.completed_days || []);
  }
}

async function saveTrackerState() {
  await supa.from('tracker_state').upsert({
    id: 1,
    current_week: currentWeek,
    completed_days: [...completedDays]
  }, {onConflict:'id'});
}

async function upsertSession(week, dayKey, exercise, weight, reps) {
  const {error} = await supa.from('sessions').upsert(
    {week, day_key:dayKey, exercise, weight:parseFloat(weight), reps:parseInt(reps)},
    {onConflict:'week,day_key,exercise'}
  );
  if (error) throw error;
}

// ---- CACHE ----
function dbKey(w,dk,n){ return `${dk}||${n}||w${w}`; }
function dbGet(w,dk,n){ return DB[dbKey(w,dk,n)]||null; }
function dbSet(w,dk,n,d){ DB[dbKey(w,dk,n)]=d; }

function ik(n){ return n.replace(/[\s\/\-]+/g,'_'); }

// ---- HISTORY ----
function getPast(dk, n, limit=10) {
  let arr = [];
  for (let w = currentWeek-1; w >= 1 && arr.length < limit; w--) {
    const d = dbGet(w, dk, n);
    if (d) arr.push({week:w, phase:getPhase(w), ...d});
  }
  return arr;
}

function getPeakWeight(dk, n) {
  // Find highest weight logged in any peak week
  let peak = 0;
  for (let w = 1; w < currentWeek; w++) {
    const ph = getPhase(w);
    if (ph.weekInCycle === 3) {
      const d = dbGet(w, dk, n);
      if (d && parseFloat(d.weight) > peak) peak = parseFloat(d.weight);
    }
  }
  return peak;
}

function getLastWeight(dk, n) {
  for (let w = currentWeek-1; w >= 1; w--) {
    const d = dbGet(w, dk, n);
    if (d && d.weight) return parseFloat(d.weight);
  }
  return null;
}

function getAllData(dk, n) {
  let arr = [];
  for (let w = 1; w <= 200; w++) {
    const d = dbGet(w, dk, n);
    if (d && d.weight) arr.push({week:w, phase:getPhase(w).key, weight:parseFloat(d.weight)||0, reps:parseInt(d.reps)||0});
  }
  return arr;
}

// ---- PHASE TARGETS ----
function getPhaseTarget(ex, phase) {
  const [rMin, rMax] = phase.repRange;
  let sets = ex.s;
  if (ex.compound) sets = Math.max(1, sets + phase.setMod);

  let targetWeight = null;
  const lastW = getLastWeight(ex.dayKey||'', ex.n);

  if (phase.weekInCycle === 4) {
    // Deload: 60% of peak or last weight
    const peak = getPeakWeight(ex.dayKey||'', ex.n);
    const base = peak > 0 ? peak : (lastW || 0);
    targetWeight = base > 0 ? Math.round((base * 0.6) / 2.5) * 2.5 : null;
  } else if (phase.weekInCycle === 1) {
    targetWeight = lastW; // same weight as last, more volume
  } else if (phase.weekInCycle === 2) {
    targetWeight = lastW ? lastW + 2.5 : null;
  } else if (phase.weekInCycle === 3) {
    targetWeight = lastW ? lastW + 5 : null;
  }

  return { sets, rMin, rMax, targetWeight };
}

// ---- SIGNAL ----
function getSignal(dk, n, ex, inp, phase) {
  const target = getPhaseTarget({...ex, dayKey:dk}, phase);
  const curReps = parseInt(inp?.reps) || 0;
  const curWeight = parseFloat(inp?.weight) || 0;
  const past = getPast(dk, n, 1);
  const prev = past[0];

  if (phase.weekInCycle === 4) {
    if (curWeight === 0) return {type:'deload', msg:`Deload week — target ${target.targetWeight ? target.targetWeight+'kg' : '60% of your peak weight'}. ${target.rMin}–${target.rMax} reps, ${target.sets} sets. Full recovery, no grinding.`};
    return {type:'deload', msg:`Good — staying light. Focus on perfect form and let your body recover.`};
  }

  if (!prev && curReps === 0) return {type:'new', msg:`First session — log your starting weight and reps to failure.`};

  if (curReps === 0) {
    const hint = target.targetWeight ? `Target: ${target.targetWeight} kg` : '';
    return {type:'hold', msg:`${phase.name} phase — ${target.rMin}–${target.rMax} reps, ${target.sets} sets. ${hint}`};
  }

  if (curReps >= target.rMax) return {type:'up', msg:`${curReps} reps — top of ${phase.name.toLowerCase()} range. Add weight next session.`};
  if (curReps >= target.rMin) return {type:'hold', msg:`${curReps} reps — inside ${phase.name.toLowerCase()} range. Build to ${target.rMax} before progressing.`};
  return {type:'warn', msg:`${curReps} reps — below ${target.rMin} target for this phase. Consider holding weight or checking form.`};
}

function sigClass(t){return{up:'sig-up',hold:'sig-hold',warn:'sig-warn',deload:'sig-deload',new:'sig-new'}[t]||'sig-hold';}
function sigIcon(t){return{up:'↑',hold:'→',warn:'⚠',deload:'🌊',new:'●'}[t]||'→';}

function phClass(k){return{accumulation:'ph-acc',intensification:'ph-int',peak:'ph-peak',deload:'ph-dl'}[k]||'';}
function phLabel(k){return{accumulation:'ACC',intensification:'INT',peak:'PEAK',deload:'DL'}[k]||k;}

function repBarHTML(n, reps, phase) {
  const [rMin,rMax] = phase.repRange;
  const pct = reps>0 ? Math.min(100,Math.round((reps/rMax)*100)) : 0;
  const color = reps>=rMax?'var(--green)':reps>=rMin?'var(--orange)':reps>0?'var(--red)':'var(--border)';
  const cc = reps>=rMax?'var(--green)':reps>=rMin?'var(--orange)':reps>0?'var(--red)':'var(--text3)';
  return `<div class="rep-bar-wrap">
    <span class="rep-range-label">${rMin}–${rMax} reps</span>
    <div class="rep-track"><div class="rep-fill" style="width:${pct}%;background:${color}"></div></div>
    <span class="rep-count" style="color:${cc}">${reps>0?reps:'—'}</span>
  </div>`;
}

// ---- RENDER PHASE BANNER ----
function renderPhaseBanner() {
  const phase = getPhase(currentWeek);
  const banner = document.getElementById('phaseBanner');
  banner.className = `phase-banner ${phase.key}`;
  document.getElementById('phaseIcon').textContent = phase.icon;
  document.getElementById('phaseName').textContent = phase.name;
  document.getElementById('phaseDesc').textContent = phase.desc;
  document.getElementById('phaseWeekLabel').textContent = `Wave ${getWaveNumber(currentWeek)} · Week`;
  document.getElementById('phaseWeekNum').textContent = currentWeek;

  const dots = [1,2,3,4].map(i => {
    const cls = ['acc','int','peak','dl'][i-1];
    const active = i === phase.weekInCycle ? 'active' : '';
    const colors = ['var(--blue)','var(--accent)','var(--red)','var(--green)'];
    return `<div class="wave-dot ${cls} ${active}" style="color:${colors[i-1]};background:${i<=phase.weekInCycle?colors[i-1]:'var(--border)'}"></div>`;
  }).join('');
  document.getElementById('waveDots').innerHTML = dots;
}

// ---- RENDER TABS ----
function renderTabs() {
  document.getElementById('dayTabs').innerHTML = DAYS.map((d,i) => {
    const done = completedDays.has(d.key);
    const active = i === currentDay ? 'active' : '';
    const comp = done ? 'completed' : '';
    const tick = done ? ' ✓' : '';
    return `<button class="day-tab ${active} ${comp}" onclick="switchDay(${i})">${d.label}${tick}</button>`;
  }).join('');
}

// ---- RENDER STATS ----
function renderStats() {
  const day = DAYS[currentDay];
  const phase = getPhase(currentWeek);
  const allEx = day.sections.flatMap(s=>s.ex);
  const totalSets = allEx.reduce((a,e)=>{
    let s = e.s;
    if (e.compound) s = Math.max(1, s + phase.setMod);
    return a + s;
  }, 0);
  const filled = allEx.filter(e=>inputs[ik(e.n)]?.weight).length;
  const sigs = allEx.map(e=>getSignal(day.key,e.n,e,inputs[ik(e.n)],phase).type);
  const upC = sigs.filter(s=>s==='up').length;
  document.getElementById('statsStrip').innerHTML=`
    <div class="stat-card"><div class="stat-label">Sets today</div><div class="stat-val">${totalSets}</div><div class="stat-sub">${phase.name.toLowerCase()}</div></div>
    <div class="stat-card"><div class="stat-label">Logged</div><div class="stat-val">${filled}/${allEx.length}</div><div class="stat-sub">exercises</div></div>
    <div class="stat-card"><div class="stat-label">On target</div><div class="stat-val" style="color:var(--green)">${upC}</div><div class="stat-sub">exercises</div></div>
    <div class="stat-card"><div class="stat-label">Wave</div><div class="stat-val" style="color:var(--accent)">${getWaveNumber(currentWeek)}</div><div class="stat-sub">week ${((currentWeek-1)%4)+1} of 4</div></div>
    <div class="stat-card"><div class="stat-label">Days done</div><div class="stat-val" style="color:var(--purple)">${completedDays.size}/5</div><div class="stat-sub">this week</div></div>
  `;
}

// ---- RENDER EXERCISES ----
function renderExercises() {
  const day = DAYS[currentDay];
  const phase = getPhase(currentWeek);
  let html = '';

  day.sections.forEach(sec => {
    html += `<div class="section-block"><div class="section-label">${sec.title}</div>`;
    sec.ex.forEach(ex => {
      const key = ik(ex.n);
      const inp = inputs[key] || {};
      const sig = getSignal(day.key, ex.n, ex, inp, phase);
      const reps = parseInt(inp.reps) || 0;
      const target = getPhaseTarget({...ex, dayKey:day.key}, phase);
      const past = getPast(day.key, ex.n, 5);
      const prev = past[0];
      const prevText = prev
        ? `prev Wk${prev.week}: <strong>${prev.weight||'—'} kg</strong> × <strong>${prev.reps||'—'} reps</strong>`
        : 'no previous data';
      const typeBadge = ex.compound ? 'badge-compound' : 'badge-iso';
      const typeLabel = ex.compound ? 'compound' : 'isolation';
      const histRows = past.map(h=>`
        <div class="hist-row">
          <span class="wk">Wk ${h.week}</span>
          <span class="ph ${phClass(h.phase.key)}">${phLabel(h.phase.key)}</span>
          <span>${h.weight||'—'} kg</span>
          <span>${h.reps||'—'} reps</span>
        </div>`).join('');

      html += `<div class="ex-card ${sigClass(sig.type)}" id="card_${key}">
        <div class="ex-top">
          <span class="ex-name">${ex.n}</span>
          <span class="badge ${typeBadge}">${typeLabel}</span>
          <span class="badge badge-sets">${target.sets} sets</span>
        </div>
        <div class="phase-target-box">
          <span class="pt-item">🎯 <strong>${target.rMin}–${target.rMax} reps</strong></span>
          <span class="pt-divider">·</span>
          <span class="pt-item"><strong>${target.sets} sets</strong></span>
          ${target.targetWeight ? `<span class="pt-divider">·</span><span class="pt-item">Target <strong>${target.targetWeight} kg</strong></span>` : ''}
        </div>
        <div class="prev-row">${prevText}</div>
        <div id="bar_${key}">${repBarHTML(ex.n, reps, phase)}</div>
        <div class="input-row">
          <div class="field"><label>Weight (kg)</label><input type="number" step="0.5" placeholder="kg" value="${inp.weight||''}" oninput="upd('${key}','weight',this.value,'${day.key}','${ex.n}')"></div>
          <div class="field"><label>Reps to failure</label><input type="number" placeholder="${target.rMin}–${target.rMax}" value="${inp.reps||''}" oninput="upd('${key}','reps',this.value,'${day.key}','${ex.n}')"></div>
        </div>
        <div class="signal-box ${sigClass(sig.type)}" id="sig_${key}"><span class="sig-icon">${sigIcon(sig.type)}</span><span>${sig.msg}</span></div>
        ${past.length>0?`<div class="hist-toggle" onclick="toggleHist('hb_${key}')">▾ history (${past.length} sessions)</div><div id="hb_${key}" style="display:none" class="hist-box">${histRows}</div>`:''}
      </div>`;
    });
    html += '</div>';
  });
  document.getElementById('exerciseArea').innerHTML = html;
}

function upd(key, field, val, dk, exName) {
  if (!inputs[key]) inputs[key] = {};
  inputs[key][field] = val;
  renderStats();
  const phase = getPhase(currentWeek);
  const reps = parseInt(inputs[key].reps)||0;
  const day = DAYS[currentDay];
  const ex = day.sections.flatMap(s=>s.ex).find(e=>ik(e.n)===key);
  if (!ex) return;
  const sig = getSignal(dk, exName, ex, inputs[key], phase);
  const sigEl = document.getElementById('sig_'+key);
  if (sigEl){sigEl.className='signal-box '+sigClass(sig.type);sigEl.innerHTML=`<span class="sig-icon">${sigIcon(sig.type)}</span><span>${sig.msg}</span>`;}
  const barEl = document.getElementById('bar_'+key);
  if (barEl) barEl.innerHTML = repBarHTML(exName, reps, phase);
  const card = document.getElementById('card_'+key);
  if (card) card.className = 'ex-card '+sigClass(sig.type);
}

function toggleHist(id){const el=document.getElementById(id);if(el)el.style.display=el.style.display==='none'?'block':'none';}

// ---- SAVE SESSION ----
async function saveSession() {
  const day = DAYS[currentDay];
  const toSave = [];
  day.sections.flatMap(s=>s.ex).forEach(ex => {
    const key = ik(ex.n);
    if (inputs[key]?.weight) toSave.push({ex, key, inp:inputs[key]});
  });
  if (toSave.length===0){showToast('Nothing to save — enter at least one weight!','var(--orange)');return;}
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setSaveStatus('saving','saving...');
  try {
    await Promise.all(toSave.map(({ex,inp})=>upsertSession(currentWeek,day.key,ex.n,inp.weight,inp.reps)));
    toSave.forEach(({ex,inp})=>dbSet(currentWeek,day.key,ex.n,inp));
    inputs = {};
    renderExercises();
    renderStats();
    setSaveStatus('saved','saved');
    showToast(`${toSave.length} exercises saved to database`);
  } catch(e) {
    setSaveStatus('error','save failed!');
    showToast('Save failed — check connection','var(--red)');
    console.error(e);
  }
  btn.disabled = false;
}

// ---- COMPLETE DAY & ADVANCE ----
async function completeDay() {
  const day = DAYS[currentDay];
  completedDays.add(day.key);

  // If all 5 days complete, advance to next week and reset
  if (completedDays.size >= 5) {
    currentWeek++;
    completedDays = new Set();
    showToast(`Week complete! Moving to Week ${currentWeek} — ${getPhase(currentWeek).name} phase 🎯`);
  } else {
    // Auto-switch to next uncompleted day
    const nextIdx = DAYS.findIndex((d,i)=>i!==currentDay&&!completedDays.has(d.key));
    if (nextIdx !== -1) currentDay = nextIdx;
    showToast(`${day.label} day complete! ${5-completedDays.size} days remaining this week.`);
  }

  inputs = {};
  setSaveStatus('saving','saving...');
  await saveTrackerState();
  setSaveStatus('saved','saved');
  renderPhaseBanner();
  renderTabs();
  renderStats();
  renderExercises();
}

function setSaveStatus(type,text){
  const el=document.getElementById('saveStatus');
  const tx=document.getElementById('saveStatusText');
  el.className='save-status '+type;
  tx.textContent=text;
  if(type==='saved')setTimeout(()=>{el.className='save-status';tx.textContent='ready';},3000);
}

function showToast(msg,bg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.background=bg||'var(--green)';
  t.style.color=bg?'white':'var(--bg)';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}

function switchDay(i){currentDay=i;inputs={};renderTabs();renderStats();renderExercises();}

// ---- GRAPHS ----
function buildGraphs(){
  Object.values(charts).forEach(c=>c.destroy());charts={};
  const grid=document.getElementById('graphGrid');
  const filteredEx=graphFilter==='all'?ALL_EX:
    graphFilter==='compound'?ALL_EX.filter(e=>e.compound):
    graphFilter==='isolation'?ALL_EX.filter(e=>!e.compound):
    ALL_EX.filter(e=>e.dayKey===graphFilter);
  const withData=filteredEx.filter(e=>getAllData(e.dayKey,e.n).length>0);
  if(withData.length===0){grid.innerHTML=`<div class="no-data" style="grid-column:1/-1">No data yet — log some sessions first.</div>`;return;}
  grid.innerHTML=withData.map(e=>`<div class="graph-card">
    <div class="graph-title">${e.n}</div>
    <div class="graph-meta">
      <span><div class="dot" style="background:var(--accent)"></div>Weight kg</span>
      <span><div class="dot" style="background:var(--blue)"></div>Reps</span>
      <span style="color:var(--text3)">${e.dayLabel}</span>
    </div>
    <canvas id="ch_${ik(e.dayKey)}_${ik(e.n)}" height="160"></canvas>
  </div>`).join('');
  withData.forEach(e=>{
    const data=getAllData(e.dayKey,e.n);
    const id=`ch_${ik(e.dayKey)}_${ik(e.n)}`;
    const ctx=document.getElementById(id);
    if(!ctx)return;
    // Background colors per phase
    const bgColors=data.map(d=>({
      accumulation:'rgba(91,158,240,0.15)',
      intensification:'rgba(232,197,71,0.15)',
      peak:'rgba(232,84,84,0.15)',
      deload:'rgba(61,214,140,0.15)'
    }[d.phase]||'transparent'));
    charts[id]=new Chart(ctx,{
      type:'line',
      data:{
        labels:data.map(d=>`W${d.week}`),
        datasets:[
          {label:'Weight (kg)',data:data.map(d=>d.weight),borderColor:'rgba(232,197,71,0.9)',backgroundColor:'rgba(232,197,71,0.08)',tension:0.35,pointRadius:5,pointBackgroundColor:data.map(d=>({accumulation:'var(--blue)',intensification:'var(--accent)',peak:'var(--red)',deload:'var(--green)'}[d.phase]||'var(--accent)')),yAxisID:'y',fill:true},
          {label:'Reps',data:data.map(d=>d.reps),borderColor:'rgba(91,158,240,0.8)',backgroundColor:'transparent',tension:0.35,pointRadius:4,pointBackgroundColor:'rgba(91,158,240,1)',yAxisID:'y2',borderDash:[4,3]}
        ]
      },
      options:{
        responsive:true,
        interaction:{mode:'index',intersect:false},
        plugins:{
          legend:{display:false},
          tooltip:{backgroundColor:'#1a1a1e',borderColor:'#2a2a2e',borderWidth:1,titleColor:'#f0ede8',bodyColor:'#9a9793',callbacks:{
            title:items=>{
              const d=data[items[0].dataIndex];
              return `Week ${d.week} — ${phLabel(d.phase)}`;
            }
          }}
        },
        scales:{
          x:{ticks:{color:'#5a5755',font:{family:'Barlow Condensed',size:11}},grid:{color:'rgba(42,42,46,0.5)'}},
          y:{position:'left',ticks:{color:'#e8c547',font:{family:'Barlow Condensed',size:11}},grid:{color:'rgba(42,42,46,0.5)'},title:{display:true,text:'kg',color:'#5a5755',font:{size:10}}},
          y2:{position:'right',ticks:{color:'#5b9ef0',font:{family:'Barlow Condensed',size:11}},grid:{drawOnChartArea:false},title:{display:true,text:'reps',color:'#5a5755',font:{size:10}}}
        }
      }
    });
  });
}

function buildFilterRow(){
  const filters=[
    {key:'all',label:'All'},{key:'compound',label:'Compound'},{key:'isolation',label:'Isolation'},
    ...DAYS.map(d=>({key:d.key,label:d.label}))
  ];
  document.getElementById('graphFilterRow').innerHTML=filters.map(f=>
    `<button class="filter-btn ${graphFilter===f.key?'active':''}" onclick="setFilter('${f.key}')">${f.label}</button>`
  ).join('');
}

function setFilter(k){graphFilter=k;buildFilterRow();buildGraphs();}

function showView(v){
  document.getElementById('view-log').style.display=v==='log'?'block':'none';
  document.getElementById('view-graphs').style.display=v==='graphs'?'block':'none';
  document.querySelectorAll('.nav-tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&v==='log')||(i===1&&v==='graphs')));
  if(v==='graphs'){buildFilterRow();buildGraphs();}
}

// ---- INIT ----
async function init(){
  const screen=document.getElementById('loadingScreen');
  const msg=document.getElementById('loadingMsg');
  try{
    msg.textContent='LOADING YOUR DATA...';
    await loadAllData();
    msg.textContent='READY';
    setTimeout(()=>screen.classList.add('hidden'),400);
  }catch(e){
    msg.textContent='CONNECTION FAILED — CHECK SUPABASE';
    msg.style.color='var(--red)';
    console.error(e);
    setTimeout(()=>screen.classList.add('hidden'),2000);
  }
  renderPhaseBanner();
  renderTabs();
  renderStats();
  renderExercises();
}

init();
</script>
